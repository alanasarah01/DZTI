<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plano de Estudos DZTI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,700&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
/* Layout: barra da marca; cabeçalho do aluno com faixa da semana; 4 números (progresso, horas, ritmo, semana);
   faixa das 6 semanas; abas Backlog e Board. Board = 3 colunas (A fazer, Fazendo, Feito) com arrastar;
   Backlog = blocos (features) com o porquê, entregáveis e tarefas. Visual da marca DZTI. */
:root{
  --bege:#ebe8e3;
  --bege2:#ddcfc7;
  --rosa:#bb2649;
  --laranja:#fd7528;
  --azul:#344c92;
  --verde:#2f6b4f;
  --preto:#000000;
  --tinta:#1a1716;
  --suave:#5e5450;
  --f-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --f-body:'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'Space Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bege);color:var(--tinta);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
a{color:inherit}

.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 56px}

.topo{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;border-bottom:1.5px solid var(--preto)}
.marca{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.marca b{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1}
.marca span{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.acoes{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.salvando{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--suave)}

.btn{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--bege);border:1.5px solid var(--preto);padding:9px 14px;box-shadow:3px 3px 0 var(--preto);cursor:pointer;transition:transform .12s, box-shadow .12s;text-decoration:none;display:inline-block}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--preto)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--preto)}
.btn--preto{background:var(--preto);color:var(--bege)}

.aviso{margin:16px 0 0;border:1.5px dashed var(--azul);color:var(--azul);padding:8px 12px;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em}
.estado{margin-top:48px;font-family:var(--f-mono);font-size:13px;letter-spacing:.04em;border:1.5px solid var(--preto);padding:18px;max-width:62ch;background:var(--bege2)}

/* ---------- cabeçalho ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 32px;align-items:end;padding-block:32px 4px}
.kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--azul);margin:0 0 10px}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(36px,6vw,68px);line-height:.98;letter-spacing:-.025em;margin:0;text-wrap:balance}
.hero h1 em{font-style:italic;color:var(--rosa)}
.hero p{margin:12px 0 0;font-size:16px;max-width:62ch}
.faixa{display:inline-block;background:var(--rosa);color:var(--bege);font-family:var(--f-display);font-style:italic;font-weight:700;font-size:clamp(17px,2.2vw,22px);padding:10px 18px;transform:rotate(-2deg);white-space:nowrap}

.numeros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:26px}
.num{border:1.5px solid var(--preto);background:var(--bege);padding:14px 16px;box-shadow:4px 4px 0 var(--preto);display:grid;gap:2px;min-width:0}
.num span{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.num b{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums}
.num small{font-size:12.5px;color:var(--suave)}
.num--alerta{box-shadow:6px 6px 0 var(--rosa)}
.num--alerta b{color:var(--rosa)}
.num--ok{box-shadow:6px 6px 0 var(--verde)}

/* ---------- 6 semanas ---------- */
.semanas{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:26px}
.sem{border:1.5px solid var(--preto);background:var(--bege);padding:10px 12px;text-align:left;cursor:pointer;display:grid;gap:4px;min-width:0}
.sem:hover{background:var(--bege2)}
.sem[aria-pressed="true"]{outline:3px solid var(--azul);outline-offset:-1px}
.sem.atual{background:var(--preto);color:var(--bege)}
.sem.atual small{color:var(--bege2)}
.sem b{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sem small{font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums}
.sem-barra{height:6px;border:1px solid currentColor;background:transparent;position:relative;overflow:hidden}
.sem-barra i{position:absolute;inset:0 auto 0 0;background:var(--rosa)}
.sem.atual .sem-barra i{background:var(--laranja)}

/* ---------- abas e filtros ---------- */
.barra-abas{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:28px;padding-block:12px;border-top:1.5px solid var(--preto);border-bottom:1.5px solid var(--preto)}
.abas{display:flex;border:1.5px solid var(--preto)}
.abas button{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--bege);border:0;padding:8px 16px;cursor:pointer}
.abas button+button{border-left:1.5px solid var(--preto)}
.abas button[aria-selected="true"]{background:var(--preto);color:var(--bege)}
.barra-abas label{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.barra-abas select{border:1.5px solid var(--preto);background:var(--bege);padding:7px 10px;max-width:260px;min-width:0}
.dica{font-size:12.5px;color:var(--suave);margin:10px 0 0}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px;align-items:start}
.coluna{border:1.5px solid var(--preto);background:var(--bege2);min-width:0}
.coluna-cab{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1.5px solid var(--preto);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;background:var(--bege)}
.coluna[data-status="doing"] .coluna-cab{background:var(--rosa);color:var(--bege)}
.coluna[data-status="done"] .coluna-cab{background:var(--preto);color:var(--bege)}
.conta{font-variant-numeric:tabular-nums;border:1.5px solid currentColor;padding:0 6px}
.coluna-corpo{display:flex;flex-direction:column;gap:10px;padding:12px;min-height:110px}
.vazio{font-family:var(--f-mono);font-size:11.5px;color:var(--suave);border:1.5px dashed var(--suave);padding:12px;text-align:center;margin:0}

.card{--c:var(--preto);position:relative;background:var(--bege);border:1.5px solid var(--preto);border-left:6px solid var(--c);padding:10px 12px;display:grid;gap:6px;cursor:grab;box-shadow:3px 3px 0 var(--preto);touch-action:pan-y;user-select:none;-webkit-user-select:none;text-align:left;width:100%}
.card:hover{box-shadow:4px 4px 0 var(--preto)}
.card-topo{display:flex;justify-content:space-between;gap:8px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.card b{font-weight:500;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.card.feito b{text-decoration:line-through;text-decoration-color:var(--rosa);color:var(--suave)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;border:1.5px solid var(--preto);padding:0 6px;background:var(--bege2);white-space:nowrap}
.chip--bloco{background:var(--c);border-color:var(--c);color:var(--bege)}
.chip--rev{background:var(--azul);border-color:var(--azul);color:var(--bege)}
.chip--atr{background:var(--rosa);border-color:var(--rosa);color:var(--bege)}
.chip--check{background:var(--laranja);border-color:var(--laranja);color:var(--preto)}
.fantasma{position:fixed;z-index:50;pointer-events:none;margin:0;transform:rotate(2deg);box-shadow:10px 10px 0 var(--laranja)}
.ph{border:1.5px dashed var(--preto);background:rgba(187,38,73,.1);min-height:60px}
.arrastando{user-select:none;-webkit-user-select:none;cursor:grabbing}

/* ---------- backlog ---------- */
.backlog{display:grid;gap:14px;margin-top:16px}
.epico{--c:var(--preto);border:1.5px solid var(--preto);border-left:8px solid var(--c);background:var(--bege)}
.epico > summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center}
.epico > summary::-webkit-details-marker{display:none}
.epico-nome{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.15;margin:0}
.epico-nome small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);font-weight:400;margin-bottom:4px}
.epico-meta{display:grid;gap:6px;justify-items:end;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap}
.prog{width:140px;height:8px;border:1.5px solid var(--preto);position:relative;background:var(--bege2)}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--preto)}
.epico-corpo{border-top:1.5px solid var(--bege2);padding:14px 16px 16px;display:grid;gap:16px}
.porque{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.porque section{background:var(--bege2);padding:12px 14px;border:1.5px solid var(--preto)}
.porque h3{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 6px;color:var(--azul)}
.porque p{margin:0;font-size:14px}
.porque ul{margin:0;padding-left:18px;font-size:14px;display:grid;gap:3px}
.tarefas{list-style:none;margin:0;padding:0;border:1.5px solid var(--preto)}
.tarefa{display:grid;grid-template-columns:110px 54px minmax(0,1fr) 92px 60px 80px;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--bege2);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;cursor:pointer;font-size:14px}
.tarefa:first-child{border-top:0}
.tarefa:hover{background:var(--bege2)}
.tarefa.feito .t-tit{text-decoration:line-through;color:var(--suave)}
.st{justify-self:start;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--preto);padding:1px 7px;white-space:nowrap}
.st-doing{background:var(--rosa);border-color:var(--rosa);color:var(--bege)}
.st-done{background:var(--preto);color:var(--bege)}
.t-id,.t-meta{font-family:var(--f-mono);font-size:11px;color:var(--suave);font-variant-numeric:tabular-nums;white-space:nowrap}
.t-tit{min-width:0;overflow-wrap:anywhere}

/* ---------- material do bloco (conteúdo do documento, com links) ---------- */
.material-box{border:1.5px solid var(--preto);background:var(--bege)}
.material-box > summary{cursor:pointer;padding:12px 16px;background:var(--preto);color:var(--bege);list-style:none;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px;transition:background .15s}
.material-box > summary:hover{background:var(--azul)}
.material-box > summary::-webkit-details-marker{display:none}
.mb-titulo{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase}
.mb-acao{font-family:var(--f-body);font-size:14px;font-weight:700;background:var(--laranja);color:var(--preto);padding:5px 12px;border:1.5px solid var(--bege);box-shadow:3px 3px 0 var(--rosa)}
.mb-acao::after{content:attr(data-fechado)}
.material-box[open] .mb-acao{background:var(--bege);box-shadow:none}
.material-box[open] .mb-acao::after{content:attr(data-aberto)}
.material{padding:6px 18px 18px;font-size:14.5px;line-height:1.6;max-width:none;overflow-wrap:anywhere}
.material h1,.material h2,.material h3,.material h4{font-family:var(--f-display);font-weight:700;line-height:1.2;margin:18px 0 6px;font-size:18px}
.material p{margin:8px 0}
.material ul,.material ol{padding-left:22px;margin:8px 0}
.material a{color:var(--azul);font-weight:500;text-underline-offset:3px}
.material blockquote{margin:12px 0;border-left:5px solid var(--rosa);background:var(--bege2);padding:6px 14px}
.material table{border-collapse:collapse;display:block;overflow-x:auto;max-width:100%;margin:10px 0;font-size:13.5px}
.material th,.material td{border:1px solid var(--suave);padding:6px 9px;text-align:left;vertical-align:top;min-width:110px}
.material th{background:var(--bege2)}
.material code{font-family:var(--f-mono);font-size:12.5px;background:var(--bege2);padding:0 4px}
.material mark{background:rgba(253,117,40,.35)}
.intro{border:1.5px solid var(--preto);border-left:8px solid var(--azul);background:var(--bege)}
.intro > summary{cursor:pointer;padding:14px 16px;font-family:var(--f-display);font-weight:700;font-size:21px;list-style:none}
.intro > summary::-webkit-details-marker{display:none}
.intro > summary small{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--suave);font-weight:400}
.det .btn-link{justify-self:start;background:none;border:0;padding:0;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px;cursor:pointer;color:var(--azul)}

/* ---------- detalhe ---------- */
dialog{border:1.5px solid var(--preto);background:var(--bege);color:var(--tinta);padding:0;width:min(620px, calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:10px 10px 0 var(--preto)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.det{display:grid;gap:14px;padding:22px}
.det .kicker{margin:0}
.det h2{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.det dl{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 14px;margin:0;font-size:14px}
.det dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px}
.det dd{margin:0;min-width:0;overflow-wrap:anywhere}
.det .opcoes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.det .opcoes button{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--preto);background:var(--bege);padding:10px 6px;cursor:pointer}
.det .opcoes button[aria-pressed="true"]{background:var(--preto);color:var(--bege)}
.det-acoes{display:flex;justify-content:flex-end}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));z-index:60;background:var(--preto);color:var(--bege);font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;padding:11px 16px;max-width:calc(100vw - 32px);box-shadow:4px 4px 0 var(--laranja)}
.toast.erro{box-shadow:4px 4px 0 var(--rosa)}

@media (max-width: 980px){
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .semanas{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tarefa{grid-template-columns:96px minmax(0,1fr) 60px;}
  .tarefa .t-id,.tarefa .t-tipo,.tarefa .t-sem{display:none}
}
@media (max-width: 700px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .faixa{justify-self:start}
  .numeros{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board{grid-template-columns:minmax(0,1fr)}
  .porque{grid-template-columns:minmax(0,1fr)}
  .epico > summary{grid-template-columns:minmax(0,1fr)}
  .epico-meta{justify-items:start}
  .num b{font-size:32px}
  .det dl{grid-template-columns:minmax(0,1fr)}
  .tarefa{grid-template-columns:auto minmax(0,1fr);gap:4px 10px}
  .tarefa .st{grid-row:1}
  .tarefa .t-meta:not(.t-tipo):not(.t-sem){grid-row:1;justify-self:end}
  .tarefa .t-tit{grid-column:1/-1;grid-row:2}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>

<div class="wrap">
  <header class="topo">
    <div class="marca"><b>DZTI</b><span>Plano de estudos</span></div>
    <div class="acoes">
      <span class="salvando" id="salvando" hidden>Salvando…</span>
      <a class="btn" id="link-jornada" href="#" hidden>Minha jornada</a>
    </div>
  </header>

  <p class="aviso" id="aviso-demo" hidden><strong>Demonstração</strong> · plano Pleno com progresso fictício · as mudanças ficam só nesta tela</p>

  <div id="conteudo"></div>
</div>

<dialog id="detalhe"><div class="det" id="det"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* Mesma URL do App da Web usada na jornada. Vazia = modo demonstração. */
const API_URL = 'https://script.google.com/macros/s/AKfycbysKP_5-o-R2ECK7TfgbFlgmch4THkdrXgfi52_LvYD2N_efZ8Vy6l_jAeathitJo5L/exec';
const PAGINA_JORNADA = '/jornada.html';
const SEMANAS = 6;

const STATUS = [
  { id: 'todo', nome: 'A fazer' }, { id: 'doing', nome: 'Fazendo' }, { id: 'done', nome: 'Feito' },
];
const TIPOS = { pratica: 'Prática', curso: 'Curso', leitura: 'Leitura', livro: 'Livro', entregavel: 'Entregável', linkedin: 'LinkedIn', checkpoint: 'Checkpoint' };
const CORES_BLOCO = ['#000000', '#bb2649', '#344c92', '#fd7528', '#2f6b4f', '#5e5450'];

let params;
try { params = new URLSearchParams(location.search); } catch (_) { params = new URLSearchParams(''); }
const ID = params.get('j');
