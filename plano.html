const DEMO_DADOS = {"aluno": {"nome": "Marina Duarte", "programa": "Do Zero à TI"}, "nivel": "Pleno", "inicio": "2026-10-26", "blocos": [{"num": -1, "nome": "Antes de começar", "porque_titulo": "Sobre o plano", "porque": "Como é o dia a dia de um(a) Engenheiro(a) de Dados, a ordem do plano e as ferramentas que você vai usar.", "resumo": "", "entregaveis": [], "material": "**PLANO DE ESTUDOS**\n\n**Engenharia de Dados Nível Pleno**\n\n*Do zero absoluto ao seu primeiro projeto de ponta a ponta*\n\n| **12**          | **5**             | **~4h**         | **Python · SQL**    |\n|-----------------|-------------------|-----------------|---------------------|\n| Blocos (0 a 11) | Projetos práticos | Média por bloco | Git · Airflow · dbt |\n\n# Antes de começar: como é o dia a dia de um(a) Engenheiro(a) de Dados\n\nAntes de instalar qualquer ferramenta, vale entender o que você está estudando para ser. Um(a) Engenheiro(a) de Dados projeta e mantém a infraestrutura que coleta, processa e armazena dados trabalhando na fronteira entre tecnologia e negócio, para que analistas e cientistas de dados tenham dados acessíveis, organizados e confiáveis para trabalhar.\n\n### O que entra na rotina\n\n| **Frente de trabalho**               | **No dia a dia, isso vira...**                                                                                                 |\n|--------------------------------------|--------------------------------------------------------------------------------------------------------------------------------|\n| Construção e manutenção de pipelines | Escrever e revisar código que coleta, transforma e move dados de um lugar para o outro, todos os dias                          |\n| Qualidade dos dados                  | Investigar por que um número \"não bateu\", criar validações e testes automáticos que travam o pipeline quando o dado vem errado |\n| Modelagem e arquitetura              | Decidir como organizar as tabelas de um Data Warehouse para consultas rápidas e fáceis de entender                             |\n| Integração de fontes                 | Conectar sistemas diferentes (APIs, bancos, planilhas) garantindo que tudo fale a mesma língua                                 |\n| Performance                          | Otimizar consultas e cargas que estão lentas ou caras demais para rodar todo dia                                               |\n| Colaboração                          | Reuniões com analistas e cientistas de dados para entender o que eles precisam consumir                                        |\n| Monitoramento                        | Checar dashboards e alertas: um pipeline quebrado de madrugada é problema seu                                                  |\n\n> **Um dia \"típico\" (ele varia bastante, mas...)**\n>\n> Manhã: checar se os pipelines rodaram durante a noite sem erro, revisar alertas, participar do daily do time.\n>\n> Meio do dia: desenvolver ou ajustar um pipeline, revisar o código de um colega (code review), escrever testes.\n>\n> Tarde: reunião com analistas/cientistas de dados para entender uma nova necessidade, documentar decisões, ajustar algo em produção.\n>\n> Isso muda muito dependendo do tamanho da empresa em times pequenos você vai fazer um pouco de tudo; em times grandes, tende a se especializar (ingestão, plataforma, streaming etc.).\n\n| **Soft skills que fazem diferença**      | **Hard skills que você vai construir neste plano** |\n|------------------------------------------|----------------------------------------------------|\n| Comunicação clara com quem não é técnico | SQL e Python                                       |\n| Resolução de problemas complexos         | Modelagem de dados                                 |\n| Adaptação em times ágeis                 | Ferramentas de orquestração e transformação        |\n| Organização e atenção a detalhes         | Versionamento de código (Git)                      |\n\n# O Toolkit do(a) Engenheiro(a) de Dados\n\nEstas são as ferramentas que compõem a caixa de ferramentas de quem trabalha com dados hoje. A coluna \"Neste plano\" mostra o que você vai efetivamente usar com a mão na massa (✅) e o que vale conhecer de vista, para entender do que se trata e falar sobre isso em entrevista .\n\n<table style=\"width:99%;\">\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 39%\" />\n<col style=\"width: 20%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Categoria</strong></th>\n<th><strong>Ferramenta(s)</strong></th>\n<th><strong>Para que serve</strong></th>\n<th><strong>Neste plano</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Editor de código (IDE)</th>\n<th>VSCode</th>\n<th>Onde você escreve e organiza todo o código SQL, Python, YAML, Markdown</th>\n<th><p>✅ Usado</p>\n<p>Bloco 0 em diante</p></th>\n</tr>\n<tr class=\"header\">\n<th>Terminal / linha de comando</th>\n<th>Terminal do VSCode</th>\n<th>Rodar comandos, scripts e instalar pacotes</th>\n<th><p>✅ Usado</p>\n<p>Bloco 0 em diante</p></th>\n</tr>\n<tr class=\"odd\">\n<th>Relembrar SQL usando Snowflake</th>\n<th>SQL + Snowflake</th>\n<th>Consultar e transformar dados em bancos e data warehouses a primeira linguagem deste plano</th>\n<th><p>✅ Usado</p>\n<p>Blocos 2, 3, 4, 5</p></th>\n</tr>\n<tr class=\"header\">\n<th>Versionamento</th>\n<th>Git + GitHub</th>\n<th>Guardar histórico do código e montar seu portfólio público</th>\n<th><p>✅ Usado</p>\n<p>Bloco 0 em diante</p></th>\n</tr>\n<tr class=\"odd\">\n<th>Cloud (geral)</th>\n<th>Microsoft Azure</th>\n<th>Plataforma cloud completa trial gratuito sem pedir cartão de crédito, ótimo para praticar</th>\n<th><p>✅ Usado</p>\n<p>Bloco 8</p></th>\n</tr>\n<tr class=\"header\">\n<th>Linguagem de programação</th>\n<th>Python</th>\n<th>Automatizar a extração de dados no Projeto Integrado final entra só depois que SQL, Snowflake, dbt e Azure já estão consolidados</th>\n<th><p>✅ Usado</p>\n<p>Bloco 9</p></th>\n</tr>\n<tr class=\"odd\">\n<th>Transformação</th>\n<th>dbt</th>\n<th>Transformar dados dentro do warehouse com SQL versionado, testado e documentado</th>\n<th><p>✅ Usado</p>\n<p>Blocos 6, 7, 9</p></th>\n</tr>\n<tr class=\"header\">\n<th>Orquestração</th>\n<th>Apache Airflow</th>\n<th>Agendar e automatizar a execução dos pipelines</th>\n<th><p>✅ Usado</p>\n<p>Bloco 9</p></th>\n</tr>\n<tr class=\"odd\">\n<th>Containers</th>\n<th>Docker</th>\n<th>Empacotar e rodar ferramentas de forma isolada e reproduzível</th>\n<th><p>Só conceito</p>\n<p>Bloco 10</p></th>\n</tr>\n<tr class=\"header\">\n<th>Orquestração de containers</th>\n<th>Kubernetes</th>\n<th>Gerenciar muitos containers rodando em produção, em escala</th>\n<th><p>Só conceito</p>\n<p>Bloco 10</p></th>\n</tr>\n<tr class=\"odd\">\n<th>Streaming (visão geral)</th>\n<th>Apache Kafka / Flink</th>\n<th>Processar dados em tempo real, à medida que são gerados</th>\n<th><p>Só conceito</p>\n<p>Bloco 11</p></th>\n</tr>\n<tr class=\"header\">\n<th>Monitoramento (visão geral)</th>\n<th>Grafana · Prometheus</th>\n<th>Visualizar a saúde dos pipelines em produção</th>\n<th><p>Só conceito</p>\n<p>Blocos 5 e 9</p></th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n\n> **Por que essa ordem?**\n>\n> SQL vem primeiro porque é a base de tudo e é onde você desenvolve a mentalidade analítica e a obsessão por qualidade de dado antes de aprender qualquer ferramenta específica.\n>\n> Snowflake entra logo depois porque é uma das plataformas mais quentes do mercado hoje vale a pena já ir se familiarizando com o ambiente cloud cedo.\n>\n> Azure entra na sequência por um motivo bem prático: o trial não pede cartão de crédito, o que facilita muito a vida de quem está começando.\n>\n> dbt entra logo depois dos projetos em Snowflake é o que transforma o SQL que você já escreveu em código versionado, testado e documentado.\n>\n> Python aparece só dentro do Projeto Integrado final (Bloco 9), como ferramenta de automação de extração de dados depois que SQL, Snowflake, dbt e Azure já estão consolidados.\n>\n> Docker, Kubernetes e Streaming ficam para o fim (Blocos 10 e 11): você só entende os conceitos, com conteúdo gratuito do YouTube, sem projeto prático isso fica para um plano mais avançado.\n\n> **Por que VSCode?**\n>\n> É gratuito, leve, tem a maior comunidade de extensões do mercado e é o editor mais usado por engenheiros de dados hoje. As extensões que você vai instalar no Bloco 0 SQLTools, GitLens, Python e Pylance, Docker cobrem praticamente tudo que você vai fazer neste plano dentro de um único programa.\n\n# Visão Geral Bloco 0 + 11 Blocos\n\n| **Bloco** | **Foco**                                                      |\n|-----------|---------------------------------------------------------------|\n| 0         | Preparando o Terreno setup do ambiente (VSCode, Git)          |\n| 1         | Fundamentos de Engenharia de Dados o mapa geral, sem código   |\n| 2         | 8 Week SQL Challenge — resolvido no Snowflake                 |\n| 3         | Mentalidade Analítica: Qualidade de Dados                     |\n| 4         | Data Warehouse Completo: Projeto DataWithBaraa (Snowflake)    |\n| 5         | Cargas Incrementais no Snowflake (STREAMS, TASKS, SCD Tipo 2) |\n| 6         | dbt Fundamentos + Modelos Incrementais                        |\n| 7         | dbt Avançado: Testes, Qualidade e Lineage                     |\n| 8         | Cloud: Microsoft Azure                                        |\n| 9         | Projeto Integrado Ponta a Ponta + Portfólio                   |\n| 10        | Containers: Docker e Kubernetes (visão geral)                 |\n| 11        | Streaming — introdução ao mundo em tempo real                 |"}, {"num": 0, "nome": "Preparando o Terreno", "porque": "Antes de aprender qualquer ferramenta específica de dados, você precisa de um ambiente de trabalho funcionando. Este bloco é 100% prático: sair dele com VSCode e Git instalados. Python só entra mais adiante (Bloco 8) — aqui a base é para você já começar a escrever SQL no próximo bloco.", "porque_titulo": "Por que esse bloco existe", "resumo": "Montar o ambiente de trabalho antes de tocar em qualquer ferramenta de dados.", "entregaveis": ["VSCode instalado com as extensões SQLTools e GitLens ativas", "Terminal integrado do VSCode funcionando com os comandos básicos", "Conta no GitHub criada, com foto e bio preenchidas", "Git configurado com seu nome e e-mail"], "material": "### <span class=\"mark\">Caso você já tenha VsCode e Git instalado pode pular para próximo</span>\n\n### O que fazer\n\n| **Passo**                  | **Detalhe**                                                                                                                      |\n|----------------------------|----------------------------------------------------------------------------------------------------------------------------------|\n| Instalar o VSCode          | Baixe, abra e instale as extensões: SQLTools, GitLens o resto (Python, Docker) instalamos quando chegar a hora                   |\n| Instalar o Git             | Configure seu nome e e-mail (git config --global user.name / user.email) e crie uma conta gratuita no GitHub                     |\n| Aprender o terminal básico | cd (entrar em pasta), ls ou dir (listar arquivos), mkdir (criar pasta), pwd (onde estou), code . (abrir a pasta atual no VSCode) |\n\nLink de como instalar Vscode e Git : [<u>Bloco 0 Guia de Instalacao Passo a Passo</u>](https://docs.google.com/document/d/1N9MTZIsHjBH8YO5Dx7ss7Yup_BAvHVp8e1br9HpYYcs/edit?tab=t.0)\n\nPreparando seu Github :\n\n- [<u>https://github.com/alanasarah01/git-na-pratica</u>](https://github.com/alanasarah01/git-na-pratica) - Como criar o perfil no git\n\n- Exercícios simulando dia a dia de commits : ([<u>https://alanasarah01.github.io/git-na-pratica/</u>](https://alanasarah01.github.io/git-na-pratica/) )\n\n### Recursos recomendados\n\n• [<u>Download oficial do VSCode</u>](https://code.visualstudio.com/download)\n\n• [<u>Criar conta no GitHub</u>](https://github.com)"}, {"num": 1, "nome": "Fundamentos de Engenharia de Dados", "porque": "Antes de aprender ferramenta por ferramenta, vale entender o mapa geral. Isso evita decorar comandos sem saber o \"porquê\" — e é exatamente esse contexto que separa quem apenas segue tutorial de quem entende o que está fazendo.", "porque_titulo": "Por que esse bloco existe", "resumo": "Entender o mapa geral (pipelines, modelagem, Data Warehouse) antes de aprender ferramenta por ferramenta.", "entregaveis": ["Escrever, com suas próprias palavras, 1 página explicando o que é um pipeline de dados e a diferença entre ETL e ELT", "Listar 3 exemplos do seu dia a dia (ou de uma empresa que você conhece) que envolvem dados batch e 3 que poderiam envolver streaming"], "material": "### Conceitos que você precisa sair sabendo explicar com suas palavras\n\n| **Conceito**        | **O que significa**                                                                                                                                |\n|---------------------|----------------------------------------------------------------------------------------------------------------------------------------------------|\n| Engenharia de Dados | Construir e manter a infraestrutura que coleta, processa e armazena dados, para que analistas e cientistas de dados possam trabalhar em cima deles |\n| Pipeline de dados   | O caminho que o dado percorre: fonte → coleta/ingestão → armazenamento → transformação → consumo                                                   |\n| ETL x ELT           | Transformar antes de carregar no destino (ETL) ou depois (ELT) ELT é o padrão mais comum em data warehouses modernos como o Snowflake              |\n| Batch x Streaming   | Processar dados em lotes programados (batch, ex.: 1x por dia) ou continuamente à medida que chegam (streaming, ex.: em segundos)                   |\n| Tipos de dados      | Estruturado (tabelas), semiestruturado (JSON, XML) e não estruturado (texto livre, imagem, áudio)                                                  |\n\n**Objetivo:** entender o fluxo de dados, ETL, Data Lake, Data Warehouse.\n\n1.  **Modelagem de Dados** **(Playlist ou video completo 9h40min)**: [<u>Curso Completo de Modelagem de Bancos de Dados com Projeto Prático</u>](https://www.youtube.com/watch?v=Kd1yqYjylCg&list=PLucm8g_ezqNoNHU8tjVeHmRGBFnjDIlxD&index=40)\n\n2.  **O que é ETL e Pipeline - [<u>Data pipeline e ETL são a mesma coisa?</u>](https://www.youtube.com/watch?v=AKjf74tS__Y)**\n\n3.  **O que é um Data Warehouse? [<u>Data Warehouse / Data Lake / Data Lakehouse // Dicionário do Programador</u>](https://www.youtube.com/watch?v=V07Pk4de-5M)**\n\n4.  **Fundamentos Engenharia de dados** [*<u>𝗧𝗵𝗲 𝗣𝗹𝘂𝗺𝗯𝗲𝗿𝘀 \\| 𝗠𝗼𝗱𝗲𝗿𝗻 𝗗𝗮𝘁𝗮 𝗪𝗮𝗿𝗲𝗵𝗼𝘂𝘀𝗲</u>*](https://www.youtube.com/watch?v=iUVxSEFUYDw&list=PLjwVjYMyoFoFXpdai-3HfKRgAtQWlBzGz)\n\n5.  **Modelagem de Dados Vídeo 2 :** [*<u>Curso Modelagem de Dados e SQL \\| Guia Para Iniciantes</u>*](https://www.youtube.com/watch?v=SEnnucNP1h0)\n\n6.  **Arquitetura Medalhão:** [*<u>Como funciona e o que é Arquitetura Medalhão?</u>*](https://www.youtube.com/watch?v=qS6Z8ticMJI)\n\n7.  Modelo dimensional (duas sugestões de vídeos para você escolher a didática que você prefere) :\n\n    1.  [<u>Data Modeling Masterclass For Data Engineers \\[2025\\]</u>](https://www.youtube.com/watch?v=K7C1sWKQU-o&t=5901s)\n\n    2.  [<u>Data Modeling in the Modern Data Stack</u>](https://www.youtube.com/watch?v=IdCmMkQLvGA&list=PLy4OcwImJzBLWhUqduwLs30YHiDpX4Xp7)\n\n8.  Extra: Assistir perguntas comuns em entrevistas de engenharia de dados: [<u>Top 10+ Data Engineer Interview Questions and Answers</u>](https://www.youtube.com/watch?v=svBO4nUDQDs)\n\n*Capítulo 1 e 2 do Livro [<u>\"Fundamentals of Data Engineering”</u>](https://drive.google.com/drive/folders/170LLuJPPiRuCr1spkbEQ385U4Fv2Lp5C)*\n\n- Extra: Vídeo de questões de entrevista de Cloud:\n\n  - [<u>Top Cloud Migration - Mock Interview Questions</u>](https://www.youtube.com/watch?v=WddTIo7noCM)\n\n**Temas essenciais**\n\n- ETL vs ELT\n\n- Data Lake vs Data Warehouse\n\n- Pipelines\n\n- Modelagem de dados (conceito simples: fato + dimensão)\n\n### Recursos recomendados\n\n• [<u>Alura O que é Engenharia de Dados (artigo)</u>](https://www.alura.com.br/artigos/engenharia-dados)\n\n• [<u>Distrito Engenharia de Dados: tudo que você precisa saber (artigo)</u>](https://www.distrito.me/blog/engenharia-de-dados)\n\n> **📚 Leitura sugerida (Biblioteca Virtual)**\n>\n> • Fundamentals of Data Engineering (Joe Reis & Matt Housley) capítulo inicial \"Data Engineering Described\", para consolidar essa visão geral com mais profundidade\n>\n> [<u>fundamentals-of-data-engineering.pdf</u>](https://drive.google.com/file/d/1608cCBV-lK0Vo8crCU-kuWR3Qwm7gQI-/view?usp=drive_link)"}, {"num": 2, "nome": "8 Week SQL Challenge no Snowflake", "porque": "Agora é hora de aplicar o que vc sabe de SQL — em cases reais e aprender as diferenças do Snowflake: QUALIFY (substitui subquery de ROW_NUMBER), funções de data diferentes, como o Snowflake lida com NULL em window frames. Resolver challenges reais vai te preparar para entrevistas técnicas onde te pedem para escrever SQL diretamente no Snowflake.", "porque_titulo": "Por que resolver no Snowflake e não no PostgreSQL?", "resumo": "Aplicar SQL avançado no Snowflake resolvendo cases reais de analytics.", "entregaveis": ["Cases #1, #2 resolvidos no Snowflake (aquecimento — ~1h)", "Cases #3, #4, #5, #6 resolvidos no Snowflake com QUALIFY e idiomas Snowflake-nativos", "Pasta sql/8-week-challenge/ no GitHub com 1 arquivo SQL por case, comentado", "README da pasta documentando as diferenças encontradas entre PostgreSQL e Snowflake", "Post no LinkedIn: 'Resolvi o 8 Week SQL Challenge no Snowflake — as diferenças que encontrei'"], "material": "### **Os 8 Case Studies (Link :** [<u>8 Week SQL Challenge — site oficial com os enunciados</u>](https://8weeksqlchallenge.com)**)**\n\n| **Case Study**     | **Domínio**        | **Tópicos SQL avançados cobertos**                                     |\n|--------------------|--------------------|------------------------------------------------------------------------|\n| \\#1 Danny’s Diner  | Restaurante        | CTEs, JOINs mútiplos, agregações condicionais, DENSE_RANK              |\n| \\#2 Pizza Runner   | Delivery           | Limpeza de dados, CASE WHEN, window functions, lida com NULLs em texto |\n| \\#3 Foodie-Fi      | Streaming / SaaS   | Churn analysis, cohorts, LAG/LEAD, análise temporal                    |\n| \\#4 Data Bank      | Fintech            | Running totals, allocation problems, date math avançado                |\n| \\#5 Data Mart      | Varejo             | Before/after analysis, ROLLUP, análise de impacto                      |\n| \\#6 Clique Bait    | E-commerce / Funil | CTEs encadeadas, funnel analysis, product metrics                      |\n| \\#7 Balanced Tree  | Moda / Varejo      | Market basket, percentile, CTEs em cadeia longa                        |\n| \\#8 Fresh Segments | Marketing          | Aggregation complexa, interest metrics, index analysis                 |\n\n> **Recomendação para este plano**\n>\n> Foque nos cases \\#3 (Foodie-Fi), \\#4 (Data Bank), \\#5 (Data Mart) e \\#6 (Clique Bait). São os que mais aparecem em entrevistas de DE e Analytics Engineer porque cobrem: churn/cohort, running totals e before/after analysis - padrões que você vai implementar em dbt nas semanas seguintes. Os cases \\#1 e \\#2 são mais simples; faça rápido como aquecimento. Os cases \\#7 e \\#8 são opcionais se sobrar tempo.\n\n### **Como adaptar para o Snowflake**\n\n| **Sintaxe original (PostgreSQL)** | **Equivalente no Snowflake**                         |\n|-----------------------------------|------------------------------------------------------|\n| ROW_NUMBER() OVER (...) + WHERE   | QUALIFY ROW_NUMBER() OVER (...) = 1                  |\n| DATE_TRUNC('month', col)          | DATE_TRUNC('MONTH', col) — mesma sintaxe             |\n| EXTRACT(EPOCH FROM ...)           | DATEDIFF('seconds', start, end)                      |\n| GENERATE_SERIES para datas        | Usar GENERATOR + DATEADD para sequências             |\n| :: (cast operator)                | TRY_CAST(col AS tipo) — mais seguro para dados sujos |\n| ILIKE (case-insensitive)          | ILIKE nativo no Snowflake — funciona igual           |\n\n**Links essenciais**\n\n- [<u>8 Week SQL Challenge — site oficial com os enunciados</u>](https://8weeksqlchallenge.com)\n\n- [<u>Repositório de referência com soluções (PostgreSQL) — katiehuangx/8-Week-SQL-Challenge</u>](https://github.com/katiehuangx/8-Week-SQL-Challenge)\n\n- [<u>Repositório alternativo com explicações detalhadas — manaswikamila05/8-Week-SQL-Challenge</u>](https://github.com/manaswikamila05/8-Week-SQL-Challenge)\n\n- Use as soluções de referência APENAS como validação após tentar resolver sozinha, o aprendizado está no processo\n\n### Recursos recomendados\n\n- [<u>Snowflake trial gratuito (30 dias, sem cartão de crédito)</u>](https://www.snowflake.com/en/snowflake-trial/)\n\n- [<u>Documentação oficial do Snowflake Getting Started</u>](https://docs.snowflake.com/en/user-guide-getting-started)\n\n- [<u>Snowflake Data Warehousing Workshop (Badge 1)</u>](https://learn.snowflake.com/en/courses/OD-ESS-DWW/) - 6h gratuitas (postar badge no LinkedIn)\n\n> **📚 Leitura sugerida (Biblioteca Virtual)**\n>\n> • The Data Warehouse Toolkit (Kimball Group) capítulos iniciais sobre modelagem dimensional, para entender por que Data Warehouses são organizados de forma diferente de um banco transacional\n>\n> [<u>The Data Warehouse Toolkit, 3rd Edition.pdf</u>](https://drive.google.com/file/d/1QJ-1oQtagVCa-k3rcK8zXZHctSj2iqOQ/view?usp=drive_link)"}, {"num": 3, "nome": "Mentalidade Analítica: Qualidade de Dados", "porque": "Saber escrever SQL não é a mesma coisa que confiar no resultado da query. Este bloco é sobre desenvolver o instinto de desconfiar do dado antes de usá-lo — a habilidade que mais separa profissionais juniores de profissionais experientes.", "porque_titulo": "Por que esse bloco existe", "resumo": "Desenvolver o instinto de desconfiar do dado antes de usá-lo.", "entregaveis": ["Conseguir explicar em entrevista o que você analisa primeiro ao receber uma nova tabela", "Entender qualidade como requisito de negócio, não só técnico", "LeetCode: 5 questões de nível médio do SQL 50", "Rodar as 6 checagens de qualidade num dataset público à sua escolha, usando apenas SQL (no Snowflake)", "Escrever um pequeno relatório (meia página) listando os problemas encontrados e como você investigaria cada um"], "material": "## Ao receber uma base de dados, o analista deve, no mínimo, avaliar:\n\n| **Verificação**       | **O que checar**                                                         |\n|-----------------------|--------------------------------------------------------------------------|\n| **Missing Values**    | Quantos e qual % de valores ausentes por coluna                          |\n| **Duplicated Values** | Linhas duplicadas - IDs únicos? Leads inflados?                          |\n| **Data Types**        | Datas como texto? Numéricos como string? Flags como texto?               |\n| **Padronização**      | UPPER vs lower, categorias inconsistentes, valores negativos inesperados |\n\nEsses pontos ajudam a responder: “Esse dado é confiável o suficiente para análise?”\n\n**Seu desafio aqui será replicar um desses vídeos recomendados, no snowflake, documentar e colocar no github:**\n\n- [<u>Limpeza de Dados em um Dataset Real - Dados do Titanic</u>](https://www.youtube.com/watch?v=RuDxj894BXQ) - REPLICAR COM SQL inves de Python\n\n- [<u>Watch me Cleaning Data in minutes with SQL</u>](https://www.youtube.com/watch?v=eOlHqTfWi6k&t=263s&pp=ugMGCgJwdBABugUEEgJwdMoFJEludHJvZHXDp8OjbyDDoCBsaW1wZXphIGRlIGRhZG9zIHNxbNgHAQ%3D%3D) - Com Transcript para Portugues\n\n- [<u>Watch me CLEANING DATA with SQL & AI in minutes</u>](https://www.youtube.com/watch?v=-nDp5_Cq1v4) - Usando IA (esse vídeo ela fez no Snowflake que você aprenderá nas proximas semanas)\n\n**Leitura recomendada**:\n\n> **📚 Leitura sugerida (Biblioteca Virtual)**\n>\n> • Data Quality Fundamentals (O'Reilly) capítulos iniciais sobre o que é qualidade de dado e por que ela quebra em silêncio\n>\n> • How to Lie with Statistics (Darrell Huff) leitura leve e clássica sobre como números enganam quando não são checados com cuidado"}, {"num": 4, "nome": "Data Warehouse Completo: DataWithBaraa no Snowflake", "porque": "O projeto DataWithBaraa (671 estrelas no GitHub) simula um cenário real: dados de ERP e CRM chegam crus, sujos e separados, você precisa construir um Data Warehouse completo do zero, com Bronze/Silver/Gold, Star Schema e queries analíticas. O original usa SQL Server; sua tarefa é adaptar tudo para o Snowflake, o que vai testar tanto o seu conhecimento SQL quanto as especificidades da engine.", "porque_titulo": "Por que este projeto?", "resumo": "Adaptar o projeto DataWithBaraa (SQL Server) para rodar inteiro no Snowflake.", "entregaveis": ["Fork do repositório original + branch snowflake-adaptation com todas as alterações", "Dados carregados via Internal Stage no Snowflake (PUT + COPY INTO)", "Schemas RAW / STAGING / ANALYTICS criados com tabelas e views equivalentes ao original", "Star Schema funcionando: fact_sales + 3 dimensões", "3 queries analíticas respondendo perguntas de negócio sobre o Gold", "README documentando as decisões de adaptação SQL Server → Snowflake", "Post no LinkedIn com o diagrama de arquitetura e link do repositório"], "material": "### **O que o projeto original cobre**\n\n| **Fase**           | **O que fazer**                                                        | **Entregável**                                              |\n|--------------------|------------------------------------------------------------------------|-------------------------------------------------------------|\n| Bronze (Raw)       | Carregar os CSVs de ERP e CRM exatamente como estão, sem transformação | Tables: raw.erp\\_\\*, raw.crm\\_\\*                            |\n| Silver (Staging)   | Limpar, padronizar, deduplicar, unir fontes ERP e CRM                  | Tables: staging.customers, staging.products, staging.orders |\n| Gold (Analytics)   | Star Schema: fact_sales + dim_customers + dim_products + dim_dates     | Views analíticas prontas para consumo                       |\n| Queries analíticas | Responder perguntas de negócio com SQL avançado sobre o Gold           | SQL com CTEs, window functions, cohorts                     |\n\n### **O que muda ao adaptar para o Snowflake**\n\n| **SQL Server (original)**     | **Snowflake (sua versão)**                                        |\n|-------------------------------|-------------------------------------------------------------------|\n| BULK INSERT para carregar CSV | PUT + COPY INTO via Internal Stage ou SnowSQL                     |\n| Stored Procedures com T-SQL   | Stored Procedures em JavaScript ou Snowflake Scripting            |\n| TOP N                         | LIMIT N (ou TOP N — o Snowflake aceita ambos)                     |\n| GETDATE()                     | CURRENT_TIMESTAMP() ou SYSDATE()                                  |\n| ISNULL(col, 0)                | COALESCE(col, 0) — padrão ANSI, funciona igual                    |\n| Schemas no mesmo DB           | Criar schemas RAW, STAGING, ANALYTICS no mesmo database Snowflake |\n\n**Links**\n\n- [<u>Repositório original — DataWithBaraa/sql-data-warehouse-project</u>](https://github.com/DataWithBaraa/sql-data-warehouse-project)\n\n- [<u>Documentação Snowflake: PUT + COPY INTO para carregamento de CSV</u>](https://docs.snowflake.com/en/user-guide/data-load-local-file-system-copy)\n\n- [<u>Snowflake Quickstart: Loading Data from CSV</u>](https://quickstarts.snowflake.com/guide/getting_started_with_snowflake/index.html)\n\n- Dica: use o diagrama de arquitetura do repo original como base e crie o seu para o Snowflake no README"}, {"num": 5, "nome": "Cargas Incrementais no Snowflake", "porque": "Você já sabe construir pipelines, mas só faz carga completa. Em produção real, full load mata o warehouse em tabelas grandes. Aqui você vai dominar os padrões incrementais que não aparecem em tutorial nenhum - MERGE, STREAMS e TASKS nativos do Snowflake.", "porque_titulo": "Por que é crítico para você?", "resumo": "Dominar os padrões de carga incremental nativos do Snowflake: MERGE, STREAMS, TASKS e SCD Tipo 2.", "entregaveis": ["STREAM configurado sobre a tabela fonte detectando mudanças", "MERGE implementado: expira registro antigo (valid_to preenchido) e insere nova versão (is_current = TRUE)", "TASK agendada com WHEN SYSTEM$STREAM_HAS_DATA rodando o MERGE automaticamente", "Teste manual completo: inserção → atualização → verificação do histórico com 2+ versões por registro", "README documentando o padrão usado e por que cada coluna (valid_from, valid_to, is_current) existe"], "material": "### **Padrões de carga incremental**\n\n| **Padrão**                  | **Quando usar**                                            | **Risco se ignorar**         |\n|-----------------------------|------------------------------------------------------------|------------------------------|\n| MERGE (upsert)              | Quando a fonte pode atualizar registros existentes         | Duplicatas silenciosas       |\n| Append-only                 | Eventos imutáveis (logs, clicks, transações)               | Custo desnecessário de MERGE |\n| Janela de tempo (watermark) | Dados que chegam com atraso (late data)                    | Perder registros atrasados   |\n| SCD Tipo 2 implementado     | Histórico de mudanças em dimensões (já conhece o conceito) | Sobrescrever histórico       |\n\n### **Recursos nativos do Snowflake para incrementais**\n\n| **Recurso** | **Para que serve**                                                                  |\n|-------------|-------------------------------------------------------------------------------------|\n| STREAMS     | Captura automaticamente INSERT/UPDATE/DELETE desde o último consumo (CDC nativo)    |\n| TASKS       | Agendamento nativo de queries/procedures sem precisar de Airflow para casos simples |\n| MERGE INTO  | Upsert atômico: atualiza se existe, insere se não existe                            |\n| TIME TRAVEL | Desfazer erros até 90 dias - seu plano B quando uma carga incremental estraga dados |\n\n**Vídeos e recursos por conceito-** não precisa assistir todos, veja o que você mais gosta da didática e assista 1 por conceito\n\n> **MERGE / Upsert**\n\n- [<u>Como a cláusula MERGE ajuda em operações de upsert (Shorts)</u>](https://www.youtube.com/shorts/lR-nX6ipiz4) - conceito rápido em português\n\n- [<u>SQL Incremental data load — 3 ways to perform Upsert (EXISTS, ROWCOUNT, MERGE)</u>](https://www.youtube.com/watch?v=3VO1AhrIz8M) - inglês com legendas, cobre MERGE vs alternativas\n\n- [<u>SQL Merge: Insert Update Delete in a Single Statement</u>](https://www.youtube.com/watch?v=qUXnu9dpur4) - inglês, mais completo\n\n> Leitura (Snowflake Docs):\n\n- [<u>MERGE — Referência SQL</u>](https://docs.snowflake.com/en/sql-reference/sql/merge)\n\n- [<u>DML Commands — Visão geral</u>](https://docs.snowflake.com/en/sql-reference/sql-dml)\n\n> **Carga incremental (conceito geral - full load vs incremental)**\n\n- [<u>SQL Incremental data load \\| Darshil Parmar</u>](https://www.youtube.com/watch?v=3VO1AhrIz8M) - inglês\n\n- Leitura em português: [<u>CDC, Watermark, Soft Delete — amandanascimento.com</u>](https://www.amandanascimento.com/post/cdc-watermark-soft-delete-%C3%ADndices-e-tiers-como-estruturar-cargas-incrementais-em-projetos-de-bi) — cobre watermark, janela de tempo e late data muito bem\n\n> Leitura (Snowflake Docs):\n>\n> **STREAMS**\n\n- [<u>Introduction to Streams and Tasks</u>](https://docs.snowflake.com/en/user-guide/data-pipelines-intro)\n\n- <u>Snowflake Streams and Tasks - Quickstart oficial</u>\n\n- [<u>Introduction to Streams</u>](https://docs.snowflake.com/en/user-guide/streams-intro)\n\n- [<u>Managing Streams</u>](https://docs.snowflake.com/en/user-guide/streams-manage)\n\n- [<u>Stream Examples</u>](https://docs.snowflake.com/en/user-guide/streams-examples)\n\n- [<u>CREATE STREAM — Referência SQL</u>](https://docs.snowflake.com/en/sql-reference/sql/create-stream)\n\n- [<u>CHANGES clause</u>](https://docs.snowflake.com/en/sql-reference/constructs/changes)\n\n> **TASKS**\n\n- [<u>Introduction to Tasks</u>](https://docs.snowflake.com/en/user-guide/tasks-intro)\n\n- [<u>Triggered Tasks</u>](https://docs.snowflake.com/en/user-guide/tasks-triggered)\n\n- [<u>CREATE TASK — Referência SQL</u>](https://docs.snowflake.com/en/sql-reference/sql/create-task)\n\n- [<u>ALTER TASK — Referência SQL</u>](https://docs.snowflake.com/en/sql-reference/sql/alter-task)\n\n> **SCD Tipo 2 (Slowly Changing Dimensions)**\n\n- [<u>O que é Slowly Changing Dimension nos Data Warehouses?</u>](https://www.youtube.com/watch?v=Tzsfod-nl4c) - conceito em português\n\n- [<u>Tipos de Dimensão — SCD (BI na Veia)</u>](https://www.youtube.com/watch?v=qHck0z9WGcc) - tipos 1, 2 e 3 em português\n\n- [<u>SCD — os tipos mais utilizados</u>](https://www.youtube.com/watch?v=-oVGjQpOeH8) - português\n\n- [<u>Slowly Changing Dimensions (SCD) Explained: Type 1, 2 & 3</u>](https://www.youtube.com/watch?v=sZFCYpojP4I) — inglês, 2026, mais completo e atual\n\n#### **Entregável principal - SCD Tipo 2 no Snowflake com MERGE + STREAM + TASK**\n\n#### **Vídeos e recursos**\n\n- [<u>Implement SCD Type 2 in Snowflake Using Streams — Step-by-Step Tutorial (YouTube, inglês, 2025)</u>](https://www.youtube.com/watch?v=qKKN5j1Hp8k) — cobre exatamente STREAM + MERGE com valid_from/valid_to, passo a passo\n\n- [<u>Snowflake Blog: Building SCD Type 2 with Streams and Tasks — Parte 1 (documentação com código completo)</u>](https://www.snowflake.com/en/blog/building-a-type-2-slowly-changing-dimension-in-snowflake-using-streams-and-tasks-part-1/)\n\n- [<u>Snowflake Blog: Building SCD Type 2 with Streams and Tasks — Parte 2 (automação com Tasks)</u>](https://www.snowflake.com/en/blog/building-a-type-2-slowly-changing-dimension-in-snowflake-using-streams-and-tasks-part-2/)\n\n- [<u>Snowflake Quickstart: Getting Started with Streams and Tasks</u>](https://quickstarts.snowflake.com/guide/getting_started_with_streams_and_tasks/index.html)\n\nEsse é o entregável mais importante da semana. Você já conhece o conceito de SCD Tipo 2 agora vai implementar do zero no Snowflake. Se quiser, siga os passos abaixo:\n\n**Passo 1 — Crie a tabela fonte  \n** A tabela que vai mudar ao longo do tempo (ex: clientes com cidade e cargo que podem mudar):\n\n> CREATE OR REPLACE TABLE src_clientes (\n>\n> cliente_id STRING,\n>\n> nome STRING,\n>\n> cidade STRING,\n>\n> cargo STRING,\n>\n> atualizado_em TIMESTAMP\n>\n> );\n\n**Passo 2 — Crie o STREAM sobre a tabela fonte  \n** O STREAM vai capturar automaticamente toda mudança (INSERT, UPDATE, DELETE):\n\n> CREATE OR REPLACE STREAM stream_clientes ON TABLE src_clientes;\n\n**Passo 3 — Crie a tabela histórica com colunas de vigência  \n** Essa é a dimensão que vai guardar o histórico completo:\n\n> CREATE OR REPLACE TABLE dim_clientes_scd2 (\n>\n> cliente_sk NUMBER AUTOINCREMENT, -- surrogate key\n>\n> cliente_id STRING, -- chave de negócio\n>\n> nome STRING,\n>\n> cidade STRING,\n>\n> cargo STRING,\n>\n> valid_from TIMESTAMP, -- quando essa versão ficou ativa\n>\n> valid_to TIMESTAMP, -- quando essa versão expirou (NULL = atual)\n>\n> is_current BOOLEAN -- TRUE = registro ativo\n>\n> );\n\n**Passo 4 — Escreva o MERGE  \n** Esse é o coração do SCD Tipo 2. Ele faz duas coisas: expira o registro antigo e insere o novo:\n\n> MERGE INTO dim_clientes_scd2 tgt\n>\n> USING (\n>\n> SELECT cliente_id, nome, cidade, cargo, atualizado_em\n>\n> FROM stream_clientes\n>\n> WHERE METADATA\\$ACTION = 'INSERT'\n>\n> ) src\n>\n> ON tgt.cliente_id = src.cliente_id AND tgt.is_current = TRUE\n>\n> -- Se o registro mudou: expira o registro antigo\n>\n> WHEN MATCHED AND (tgt.cidade \\<\\> src.cidade OR tgt.cargo \\<\\> src.cargo) THEN\n>\n> UPDATE SET\n>\n> tgt.valid_to = CURRENT_TIMESTAMP(),\n>\n> tgt.is_current = FALSE\n>\n> -- Se é um registro novo: insere a nova versão\n>\n> WHEN NOT MATCHED THEN\n>\n> INSERT (cliente_id, nome, cidade, cargo, valid_from, valid_to, is_current)\n>\n> VALUES (src.cliente_id, src.nome, src.cidade, src.cargo,\n>\n> CURRENT_TIMESTAMP(), NULL, TRUE);\n\n> ⚠️ **Atenção:** o MERGE acima expira o registro antigo, mas não insere automaticamente a nova versão quando há UPDATE. Para isso, você precisa de um segundo INSERT logo depois do MERGE consumindo o stream novamente, ou usar a abordagem de dois passos (UPDATE + INSERT separados). O blog oficial do Snowflake nos links abaixo mostra o padrão completo com a VIEW intermediária.\n\n**Passo 5 — Crie a TASK que roda o MERGE automaticamente**\n\n> CREATE OR REPLACE TASK task_scd2_clientes\n>\n> WAREHOUSE = COMPUTE_WH\n>\n> WHEN SYSTEM\\$STREAM_HAS_DATA('stream_clientes')\n>\n> AS\n>\n> -- cole aqui o MERGE do Passo 4;\n>\n> ALTER TASK task_scd2_clientes RESUME;\n\n**Passo 6 — Teste o pipeline completo**\n\n> -- 1. Insira um cliente novo\n>\n> INSERT INTO src_clientes VALUES ('C001', 'Ana Lima', 'São Paulo', 'Analista', CURRENT_TIMESTAMP());\n>\n> -- 2. Confira que o stream capturou\n>\n> SELECT \\* FROM stream_clientes;\n>\n> -- 3. Execute a task manualmente para testar\n>\n> EXECUTE TASK task_scd2_clientes;\n>\n> -- 4. Confira o histórico\n>\n> SELECT \\* FROM dim_clientes_scd2;\n>\n> -- 5. Agora atualize o cargo da Ana e veja o histórico crescer\n>\n> UPDATE src_clientes SET cargo = 'Sênior', atualizado_em = CURRENT_TIMESTAMP()\n>\n> WHERE cliente_id = 'C001';\n>\n> EXECUTE TASK task_scd2_clientes;\n>\n> SELECT \\* FROM dim_clientes_scd2 ORDER BY cliente_id, valid_from;\n>\n> -- Você deve ver 2 linhas para a Ana: a antiga com valid_to preenchido e a nova com is_current = TRUE"}, {"num": 6, "nome": "dbt Fundamentos + Modelos Incrementais", "porque": "A ponte entre SQL e Engenharia de Software: transformar SQL em código versionado, testável e documentável.", "porque_titulo": "Por que esse bloco existe", "resumo": "A ponte entre SQL e Engenharia de Software: transformar SQL em código versionado, testável e documentável.", "entregaveis": ["Projeto dbt conectado ao Snowflake com estrutura staging/intermediate/marts", "Gold do projeto DataWithBaraa migrado para models dbt (fact_sales, dim_customers, dim_products)", "1 modelo incremental funcionando com unique_key e is_incremental()", "dbt docs generate — documentação publicada com lineage graph"], "material": "> **A ponte entre SQL e Engenharia de Software**\n>\n> Você já sabe SQL avançado e já tem um Data Warehouse funcionando no Snowflake. O dbt é o que transforma esse SQL em código versionado, testável e documentável. O projeto DataWithBaraa que você criou na Semana 4 vai ser a base perfeita para migrar para o dbt.\n\n### **1 - dbt do zero ao primeiro modelo**\n\n- [<u>dbt Fundamentals — curso oficial gratuito (~5h)</u>](https://learn.getdbt.com/courses/dbt-fundamentals)\n\n- Conectar dbt ao Snowflake: profiles.yml, conexão de desenvolvimento\n\n- Criar primeiros 3 models: 1 staging (limpeza), 1 intermediate, 1 mart (Gold)\n\n- Configurar ref(), source() e entender o DAG de dependências\n\n- Meta-tarefa: migrar as views do Gold do projeto DataWithBaraa para models dbt\n\n### **2 - Modelos Incrementais no dbt**\n\n| **Configuração dbt**                  | **Equivale a**                                                     |\n|---------------------------------------|--------------------------------------------------------------------|\n| materialized='incremental'            | MERGE ou append automático a cada dbt run                          |\n| unique_key                            | A chave usada no MERGE (evitar duplicatas)                         |\n| is_incremental()                      | Filtro que só aplica quando rodando incremental (não full refresh) |\n| incremental_strategy='merge'          | Força MERGE em vez de DELETE+INSERT                                |\n| on_schema_change='append_new_columns' | Lidar com evolução de schema sem quebrar                           |\n\n**Vídeos e recursos**\n\n- [<u>Projeto ELT com Snowflake — inglês, 34 min (visão geral de pipeline incremental)</u>](https://www.youtube.com/watch?v=OLXkGB7krGo&t=95s)\n\n- [<u>Documentação oficial: Incremental models</u>](https://docs.getdbt.com/docs/build/incremental-models)\n\n- [<u>Darshil Parmar — canal com projetos dbt completos</u>](https://www.youtube.com/@DarshilParmar)"}, {"num": 7, "nome": "dbt Avançado: Testes, Qualidade e Lineage", "porque": "Você já tem um projeto dbt funcionando com os models do DataWithBaraa migrados (fact_sales, dim_customers, dim_products, dim_dates). Agora vai fazer esse projeto se parecer com produção de verdade: adicionar testes que quebram o pipeline quando o dado está errado, substituir a implementação manual de SCD Tipo 2 das Semanas 5-6 por um snapshot declarativo, criar um macro reutilizável e gerar a documentação com lineage graph. Você vai trazer seu projeto do snowflake da semana 5-6 para o dbt.", "porque_titulo": "O que vai ser feito nessa bloco ?", "resumo": "Transformar o projeto dbt em algo parecido com produção: testes, snapshot declarativo, macro e documentação.", "entregaveis": ["dbt test rodando sem falhas — todo mart com pelo menos not_null, unique e relationships", "1 teste customizado SQL para regra de negócio (ex: receita nunca negativa)", "dbt_expectations configurado em pelo menos 1 coluna numérica", "Snapshot substituindo a implementação manual de SCD Tipo 2 das Semanas 5-6", "1 macro criado e usado em pelo menos 2 models", "Todas as colunas dos marts documentadas no schema.yml", "Print do lineage graph tirado do dbt docs serve e postado no LinkedIn"], "material": "> **O que separa um pipeline amador de um pipeline de produção**\n>\n> Qualquer um faz o dado mover de A para B. O que um Engenheiro sênior faz diferente é garantir que o dado chegou CERTO em B. Essa semana é sobre confiança no pipeline.\n\n## **1- Testes no dbt**\n\n### **Passo 1 — Instale os pacotes dbt_utils e dbt_expectations**\n\nNo arquivo packages.yml do seu projeto:\n\n> packages:\n>\n> \\- package: dbt-labs/dbt_utils\n>\n> version: 1.2.0\n>\n> \\- package: calogica/dbt_expectations\n>\n> version: 0.10.3\n\nDepois rode:\n\n> dbt deps\n\n### **Passo 2 — Adicione testes a todos os models existentes**\n\nNo arquivo schema.yml de cada pasta (staging, marts), adicione testes. Exemplo real para o dim_customers e fact_sales:\n\n> models:\n>\n> \\- name: dim_customers\n>\n> columns:\n>\n> \\- name: customer_key\n>\n> tests:\n>\n> \\- not_null\n>\n> \\- unique\n>\n> \\- name: customer_id\n>\n> tests:\n>\n> \\- not_null\n>\n> \\- name: country\n>\n> tests:\n>\n> \\- not_null\n>\n> \\- accepted_values:\n>\n> values: \\['Germany', 'France', 'Brazil', 'USA', 'UK'\\]\n>\n> \\- name: fact_sales\n>\n> columns:\n>\n> \\- name: order_id\n>\n> tests:\n>\n> \\- not_null\n>\n> \\- unique\n>\n> \\- name: customer_key\n>\n> tests:\n>\n> \\- not_null\n>\n> \\- relationships:\n>\n> to: ref('dim_customers')\n>\n> field: customer_key\n>\n> \\- name: amount\n>\n> tests:\n>\n> \\- dbt_expectations.expect_column_values_to_be_between:\n>\n> min_value: 0\n>\n> max_value: 999999\n\n*Meta: nenhum mart pode ter FK quebrada, nulo em chave primária ou valor de receita negativo.*\n\n### **Passo 3 — Escreva 1 teste customizado em SQL**\n\nCrie o arquivo tests/assert_receita_nunca_negativa.sql:\n\n> -- Este teste falha se qualquer pedido tiver receita negativa\n>\n> SELECT order_id, amount\n>\n> FROM {{ ref('fact_sales') }}\n>\n> WHERE amount \\< 0\n\nSe retornar qualquer linha, o dbt test vai falhar — exatamente o que você quer.\n\n### **Passo 4 — Rode e valide**\n\n> dbt test \\# roda todos os testes\n>\n> dbt test --select dim_customers \\# só um model\n>\n> dbt test --store-failures \\# salva as linhas que falharam numa tabela no Snowflake\n\n## **2 - Snapshots, Macros e Documentação**\n\n### **Passo 5 — Substitua o SCD Tipo 2 manual por um dbt Snapshot**\n\nNas Semanas 5-6 você implementou SCD Tipo 2 manualmente com MERGE + STREAM + TASK. Agora vai fazer a mesma coisa de forma declarativa no dbt — muito mais limpo.\n\nCrie o arquivo snapshots/snap_clientes.sql:\n\n> {% snapshot snap_clientes %}\n>\n> {{\n>\n> config(\n>\n> target_schema='snapshots',\n>\n> unique_key='cliente_id',\n>\n> strategy='check',\n>\n> check_cols=\\['cidade', 'cargo'\\]\n>\n> )\n>\n> }}\n>\n> SELECT\n>\n> cliente_id,\n>\n> nome,\n>\n> cidade,\n>\n> cargo,\n>\n> atualizado_em\n>\n> FROM {{ source('raw', 'src_clientes') }}\n>\n> {% endsnapshot %}\n\nRode com:\n\n> dbt snapshot\n\nO dbt vai criar automaticamente as colunas dbt_valid_from, dbt_valid_to e dbt_scd_id — equivalentes ao valid_from / valid_to / is_current que você fez manualmente. Mesmo resultado, zero SQL manual.\n\n### **Passo 6 — Crie 1 macro reutilizável**\n\nIdentifique uma lógica que você repetiu em mais de um model. Por exemplo, gerar uma surrogate key. Crie o arquivo macros/gerar_surrogate_key.sql:\n\n> {% macro gerar_surrogate_key(colunas) %}\n>\n> {{ dbt_utils.generate_surrogate_key(colunas) }}\n>\n> {% endmacro %}\n\nAgora use nos seus models em vez de repetir a lógica:\n\n> SELECT\n>\n> {{ gerar_surrogate_key(\\['order_id', 'product_id'\\]) }} AS order_key,\n>\n> ...\n\n### **Passo 7 — Documente todas as colunas dos marts**\n\nNo schema.yml dos marts, adicione description em cada coluna relevante:\n\n> models:\n>\n> \\- name: fact_sales\n>\n> description: \"Tabela fato com todos os pedidos de venda. Granularidade: 1 linha por pedido.\"\n>\n> columns:\n>\n> \\- name: order_id\n>\n> description: \"Identificador único do pedido, vindo do sistema ERP\"\n>\n> \\- name: amount\n>\n> description: \"Valor total do pedido em USD, sem impostos\"\n>\n> \\- name: customer_key\n>\n> description: \"FK para dim_customers — chave surrogate gerada pelo dbt\"\n\n### **Passo 8 — Gere e inspecione a documentação**\n\n> dbt docs generate \\# gera os arquivos de documentação\n>\n> dbt docs serve \\# abre no browser em localhost:8080\n\nNavegue pelo lineage graph e confirme que você consegue ver:\n\n- A origem de cada mart (quais sources alimentam)\n\n- As dependências entre staging → intermediate → marts\n\n- Os testes associados a cada coluna\n\n> **📸 Tire um print do lineage graph**\n>\n> Esse é o entregável mais visual da semana e impressiona em entrevista. Poste no LinkedIn com o título: 'Assim ficou o lineage graph do meu projeto dbt no Snowflake'.\n\n## **Vídeos e recursos**\n\n- [<u>dbt Testing — documentação oficial</u>](https://docs.getdbt.com/docs/build/data-tests)\n\n- [<u>dbt Snapshots (SCD Tipo 2 declarativo) — documentação oficial</u>](https://docs.getdbt.com/docs/build/snapshots)\n\n- [<u>dbt_utils package — macros e testes extras</u>](https://hub.getdbt.com/dbt-labs/dbt_utils/latest/)\n\n- [<u>dbt_expectations package — testes avançados estilo Great Expectations</u>](https://hub.getdbt.com/calogica/dbt_expectations/latest/)\n\n- [<u>Darshil Parmar — canal com projetos dbt completos (inglês)</u>](https://www.youtube.com/@DarshilParmar)\n\n## **Tabela de referência rápida: tipos de teste**\n\n| **Tipo de Teste**     | **O que detecta**                    | **Exemplo prático**                        |\n|-----------------------|--------------------------------------|--------------------------------------------|\n| not_null              | Valores nulos em coluna obrigatória  | customer_id nunca pode ser nulo            |\n| unique                | Duplicatas em chave primária         | order_id deve ser único no mart            |\n| accepted_values       | Valores fora de um conjunto válido   | status deve ser 'active' ou 'inactive'     |\n| relationships         | Integridade referencial entre models | order.customer_key existe em dim_customers |\n| Teste customizado SQL | Regra de negócio específica          | Receita nunca pode ser negativa            |\n| dbt_expectations      | Faixa de valores, não nulos, padrões | amount entre 0 e 999999                    |\n\n## **Comparação: SCD Tipo 2 manual vs dbt Snapshot**\n\n| **Aspecto**             | **SQL Manual (Semanas 5-6)**     | **dbt Snapshot (Semana 10)**                    |\n|-------------------------|----------------------------------|-------------------------------------------------|\n| Colunas de vigência     | valid_from, valid_to, is_current | dbt_valid_from, dbt_valid_to, dbt_scd_id        |\n| Como detecta mudança    | STREAM + METADATA\\$ACTION        | Comparação automática das colunas em check_cols |\n| Como atualiza           | MERGE manual + TASK              | dbt snapshot (gerenciado pelo dbt)              |\n| Versionado no Git       | Scripts SQL separados            | Arquivo .sql dentro do projeto dbt              |\n| Quando usar em produção | Controle granular com CDC real   | Pipeline dbt-first, sem orquestração externa    |"}, {"num": 8, "nome": "Cloud: Microsoft Azure", "porque": "Depois do Snowflake, vale a pena conhecer uma cloud completa — e a Azure tem uma vantagem prática enorme para quem está começando: o trial gratuito não pede cartão de crédito.", "porque_titulo": "Por que esse bloco existe", "resumo": "Conhecer uma cloud completa além do Snowflake — o trial da Azure não pede cartão de crédito.", "entregaveis": ["Conta gratuita Azure criada", "1 Storage Account criado, com um arquivo CSV enviado manualmente para dentro dele"], "material": "**Objetivo:** Fazer conta Trial da Azure e <span class=\"mark\">entender o fluxo de dados e processos de ETL (Extração, Transformação e Carga) e nivelar conceitos de cloud, DW moderno, ELT/ETL.</span>  \n**faça:**\n\n- <span class=\"mark\">AZ-900 (conceitos de cloud) – módulos gratuitos.</span> ([<u>Microsoft Learn</u>](https://learn.microsoft.com/en-us/training/paths/microsoft-azure-fundamentals-describe-cloud-concepts/?utm_source=chatgpt.com)) (Postar badge no linkedin)\n\n- <span class=\"mark\">Atividades:</span>\n\n  - Ler sobre ferramentas de ETL\n\n    - [<u>Sugestao de Video</u>](https://www.youtube.com/watch?v=_Nk0v9qUWk4)\n\n  - <u>Youtube :</u> [<u>Azure Playlist Kahan Data Solutions</u>](https://www.youtube.com/playlist?list=PLy4OcwImJzBKI-dyPZddcHtab7f5nZkpH) <u>( 2 Horas) - Foque no video How to Use Azure Data Factory</u>\n\n  - [<u>Criar conta gratuita Azure (sem cartão de crédito no plano free)</u>](https://azure.microsoft.com/pt-br/free/)\n\n  - Sugestão de Curso Udemy - [<u>Azure Data Factory For Data Engineers</u>](https://www.udemy.com/course/learn-azure-data-factory-from-scratch/?couponCode=MT150725C) (12 horas)\n\n### Conceitos e prática\n\n| **Conceito**                      | **O que você aprende**                                                                                      |\n|-----------------------------------|-------------------------------------------------------------------------------------------------------------|\n| Conceitos gerais de cloud         | Regiões, resource groups, o que é IaaS/PaaS/SaaS na prática                                                 |\n| Azure Storage (Blob Storage)      | Onde arquivos e dados brutos ficam guardados na nuvem                                                       |\n| Visão geral do Azure Data Factory | A ferramenta de orquestração/ingestão nativa da Azure só para você reconhecer o nome e saber para que serve |\n| Navegação no portal Azure         | Criar recursos, entender custos e limites do free tier                                                      |"}, {"num": 9, "nome": "Projeto Integrado Ponta a Ponta + Portfólio", "porque": "Montar um projeto original do zero mostrando a stack completa integrada: Python, dbt e Airflow.", "porque_titulo": "Por que esse bloco existe", "resumo": "Montar um projeto original do zero mostrando a stack completa integrada: Python, dbt e Airflow.", "entregaveis": ["Pipeline rodando ponta a ponta: ingest → dbt → testes → mart pronto para BI", "dbt test sem falhas + documentação publicada", "Airflow DAG versionada no GitHub", "README profissional com diagrama de arquitetura", "Post no LinkedIn com prints do lineage graph, Airflow e o mart Gold"], "material": "> **O projeto que une tudo**\n>\n> Nas 12 semanas anteriores você já construiu muítas peças: Git, Snowflake, 8 Week SQL Challenge, Data Warehouse (DataWithBaraa), incrementais, dbt e Airflow. Agora o objetivo é montar um projeto original do zero que mostre a stack completa integrada, escolhendo um novo domínio de negócio.\n\n### **Sugestões de domínio para o projeto final**\n\n| **Domínio**         | **Dataset sugerido (Kaggle)**                                                                                     | **KPIs para o mart Gold**                                    |\n|---------------------|-------------------------------------------------------------------------------------------------------------------|--------------------------------------------------------------|\n| Streaming de mídia  | [<u>Netflix Shows</u>](https://www.kaggle.com/datasets/shivamb/netflix-shows) + API TMDb                          | Conteúdo por gênero/país, lançamentos por ano, top diretores |\n| E-commerce / varejo | [<u>Brazilian E-Commerce (Olist)</u>](https://www.kaggle.com/datasets/olistbr/brazilian-ecommerce)                | GMV, ticket médio, churn de vendedores, SLA de entrega       |\n| Marketing / CRM     | [<u>Customer Personality Analysis</u>](https://www.kaggle.com/datasets/imakash3011/customer-personality-analysis) | CAC, taxa de conversão, RFM, resposta por campanha           |\n\n### **Arquitetura obrigatória**\n\n| **Camada**          | **Responsável**    | **Conteúdo**                                             |\n|---------------------|--------------------|----------------------------------------------------------|\n| 🥉 Bronze (RAW)     | Python script      | Dado bruto da fonte, sem transformação, data de ingestão |\n| 🥈 Silver (STAGING) | dbt staging models | Limpo, tipado, deduplicado, padronizado                  |\n| 🥇 Gold (MARTS)     | dbt mart models    | Agregações de negócio, KPIs, prontos para consumo        |\n| Orquestração        | Airflow DAG        | RAW → dbt run → dbt test → validação final               |\n\n### **📁 Estrutura obrigatória no GitHub**\n\n| **Pasta/Arquivo**   | **Conteúdo**                                                       |\n|---------------------|--------------------------------------------------------------------|\n| ingestion/          | Scripts Python de extração + carregamento para RAW                 |\n| dbt/models/staging/ | Models de limpeza (1 por fonte)                                    |\n| dbt/models/marts/   | Models de negócio com testes documentados                          |\n| dbt/snapshots/      | SCD Tipo 2 de pelo menos 1 dimensão                                |\n| dags/               | DAG Airflow orquestrando o pipeline completo                       |\n| README.md           | Diagrama da arquitetura, decisões de design, como rodar localmente |"}, {"num": 10, "nome": "Containers: Docker e Kubernetes (Visão Geral)", "porque": "Este bloco é só para entender o que são e para que servem — sem projeto prático. Docker e Kubernetes são ferramentas de infraestrutura que você vai encontrar em praticamente todo time de dados mais maduro, e vale muito a pena reconhecer os conceitos e o vocabulário. O hands-on completo fica para um plano mais avançado.", "porque_titulo": "Por que esse bloco existe", "resumo": "Entender os conceitos de containers, sem projeto prático.", "entregaveis": ["Assistir aos vídeos e conseguir explicar, com suas palavras, a diferença entre Docker e Kubernetes", "Conseguir explicar em uma entrevista por que um time de dados usaria containers"], "material": "### Conceitos\n\n| **Conceito**                                | **O que você precisa saber**                                                                                                     |\n|---------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------|\n| O que é um container                        | Uma forma de empacotar uma aplicação com tudo que ela precisa para rodar, de forma isolada e reproduzível em qualquer máquina    |\n| Docker                                      | A ferramenta mais usada para criar e rodar containers imagens, Dockerfile, docker-compose                                        |\n| Por que times de dados usam Docker          | Para rodar ferramentas (Airflow, bancos, dbt) de forma consistente entre o notebook do desenvolvedor e o servidor de produção    |\n| Kubernetes (K8s)                            | Uma ferramenta para gerenciar muitos containers rodando ao mesmo tempo, em escala, com auto-recuperação e balanceamento de carga |\n| Quando você realmente precisa de Kubernetes | Geralmente não no início da carreira é mais comum encontrar em empresas grandes com dezenas de serviços rodando simultaneamente  |\n\n### Recursos recomendados\n\n• [<u>INTENSIVÃO Docker em 2h curso gratuito completo</u>](https://www.youtube.com/watch?v=DQjZyHwci-0)\n\n• [<u>\\#01 Primeiros passos com Docker playlist introdutória</u>](https://www.youtube.com/watch?v=j9vfSaCIyPI)\n\n> **📚 Leitura sugerida (Biblioteca Virtual)**\n>\n> • Designing Data-Intensive Applications (Martin Kleppmann) boa leitura de referência (mais avançada) sobre os fundamentos de sistemas distribuídos por trás dessas ferramentas"}, {"num": 11, "nome": "Streaming: Introdução ao Mundo em Tempo Real", "porque": "Assim como Docker e Kubernetes, este bloco é só conceito — não vamos configurar um cluster Kafka aqui. O objetivo é você entender quando streaming é realmente necessário (nem sempre é!) e conseguir falar sobre isso com propriedade numa entrevista.", "porque_titulo": "Por que esse bloco existe", "resumo": "Entender quando streaming é realmente necessário, só conceito.", "entregaveis": ["Escrever, no README do seu portfólio, 3 exemplos reais em que você usaria streaming e 3 em que batch já seria suficiente e por quê"], "material": "### Conceitos\n\n| **Conceito**                                  | **O que você aprende**                                                            |\n|-----------------------------------------------|-----------------------------------------------------------------------------------|\n| Batch x Streaming (revisão)                   | Voltando ao Bloco 1, agora com mais contexto prático                              |\n| Evento, producer, consumer, tópico            | O vocabulário básico por trás do Apache Kafka                                     |\n| Quando streaming é necessário                 | Casos reais (detecção de fraude, monitoramento) x casos onde batch já resolve bem |\n| Onde entram Kafka, Flink e equivalentes cloud | Kafka/Flink on-premise, e os equivalentes AWS Kinesis / Azure Stream Analytics    |\n\n### Recursos recomendados\n\n• [<u>O que é o Apache Kafka? (YouTube)</u>](https://www.youtube.com/watch?v=x8z3qS4HclI)\n\n• [<u>Introdução ao Apache Kafka Parte 1 (Full Cycle)</u>](https://www.youtube.com/watch?v=o5yviW6QSrE)\n\n> **📚 Leitura sugerida (Biblioteca Virtual)**\n>\n> • Designing Data-Intensive Applications (Martin Kleppmann) capítulo sobre processamento de stream, referência clássica no assunto\n\n# **Como medir seu progresso**\n\n| **Nível** | **Checkpoint**                                                                                          |\n|-----------|---------------------------------------------------------------------------------------------------------|\n| Nível 1   | Ambiente pronto: VSCode, Git e GitHub configurados                                                      |\n| Nível 2   | Consegue explicar com suas próprias palavras o que é um pipeline de dados e a diferença entre ETL e ELT |\n| Nível 3   | Resolveu os cases \\#3 a \\#6 do 8 Week SQL Challenge no Snowflake usando QUALIFY em vez de subquery      |\n| Nível 4   | Rodou as 6 checagens de qualidade de dado num dataset real, só com SQL no Snowflake                     |\n| Nível 5   | Data Warehouse DataWithBaraa funcionando no Snowflake com Star Schema e queries analíticas              |\n| Nível 6   | Pipeline incremental: dado novo na fonte → atualizado no Snowflake via STREAM + TASK em minutos         |\n| Nível 7   | dbt build sem falhas + lineage graph gerado com os modelos do DataWithBaraa migrados                    |\n| Nível 8   | dbt test cobrindo os marts, com snapshot substituindo a implementação manual de SCD Tipo 2              |\n| Nível 9   | Conta Azure criada, com um Storage Account e um arquivo enviado manualmente                             |\n| Nível 10  | Pipeline ponta a ponta do Projeto Integrado rodando, com Airflow orquestrando o dbt                     |\n| Nível 11  | Projeto final publicado no GitHub e compartilhado no LinkedIn                                           |\n\n## **Extensão Opcional (pós-plano)**\n\n- [<u>Data Engineering Zoomcamp (gratuito) - dbt/Kafka/Kestra/Spark</u>](https://github.com/DataTalksClub/data-engineering-zoomcamp)\n\n- [<u>SnowPro Core Certification - próximo passo em Snowflake</u>](https://learn.snowflake.com/en/certifications/snowpro-core/)\n\n- [<u>Azure Data Factory - Curso Udemy (conector cloud enterprise)</u>](https://www.udemy.com/course/learn-azure-data-factory-from-scratch/?couponCode=MT150725C)\n\n- [<u>Airbyte ou Fivetran - ferramentas de ingestão gerenciada (tendência 2025)</u>](https://airbyte.com/)\n\n## **Canais recomendados no YouTube**\n\n- [<u>Darshil Parmar</u>](https://www.youtube.com/@DarshilParmar) - projetos práticos de DE com stack moderna\n\n- [<u>Luciano Galvão</u>](https://www.youtube.com/live/n3R0c2ZB6BQ) - lives com projetos do 0 para portfólio\n\n- [<u>Aprender Dados</u>](https://www.youtube.com/@AprenderDados) - dbt, Databricks, Airflow explicados\n\n- [<u>DataHackers</u>](https://www.youtube.com/@DataHackers) - podcast e conteúdo sobre mercado de dados BR\n\n- [<u>Nerd dos Dados</u>](https://www.youtube.com/@nerddosdados) - conteúdos sobre carreira e técnica\n\n- [<u>Kahan Data Solutions</u>](https://www.youtube.com/playlist?list=PLy4OcwImJzBKI-dyPZddcHtab7f5nZkpH) - Azure + Snowflake (inglês)\n\n## **Trilhas com certificação gratuita**\n\n- [<u>dbt Fundamentals - Oficial gratuito</u>](https://learn.getdbt.com/courses/dbt-fundamentals)\n\n- [<u>Snowflake Data Warehousing Workshop (Badge 1)</u>](https://learn.snowflake.com/en/courses/OD-ESS-DWW/)\n\n- [<u>Microsoft Learn - Azure e Power BI</u>](https://learn.microsoft.com/)\n\n- [<u>Google Cloud Skills Boost - dados e IA</u>](https://www.cloudskillsboost.google/)\n\n- [<u>Kaggle - microcursos gratuitos em Python, SQL e dados</u>](https://www.kaggle.com/learn)\n\n## **Recursos: Git Avançado e Metodologias Ágeis**\n\n### **Git**\n\n- [<u>Git e GitHub para Iniciantes até Avançado - YouTube</u>](https://www.youtube.com/watch?v=DqTITcMq68k)\n\n- [<u>Conventional Commits - padrão de mensagens semânticas</u>](https://www.conventionalcommits.org/pt-br/v1.0.0/)\n\n### **Metodologias Ágeis**\n\n- [<u>Introdução ao Agile (YouTube)</u>](https://www.youtube.com/watch?v=HFH3GA9vbFI)\n\n- [<u>Scrum e Agile na prática</u>](https://youtu.be/HdE8S2ALvWI)\n\n# Depois desse plano: para onde ir\n\n> **Próximo passo natural**\n>\n> Terminando o Bloco 0 + 11 blocos, você já tem o vocabulário, as ferramentas básicas e um projeto de portfólio. O próximo passo é aprofundar cada peça em nível intermediário: Python para automação além do Projeto Integrado, Airflow em produção com mais DAGs, e aí sim Docker e Kubernetes na prática.\n\n### Leituras de cabeceira (a qualquer momento do plano)\n\n> **📚 Leitura suge const estado = { aluno: {}, nivel: '', inicio: '', blocos: [], tarefas: [], status: {}, aba: 'backlog', semana: 'agora', bloco: '' };
const $ = (s) => document.querySelector(s);

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
const copiar = (x) => JSON.parse(JSON.stringify(x));
const st = (id) => { const v = estado.status[id]; return v === 'done' ? 'done' : v === 'doing' || v === 'review' ? 'doing' : 'todo'; };
const fmtH = (h) => (Math.round(h * 10) / 10).toString().replace('.', ',') + ' h';
function dataISO(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
const dd = (dt) => String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0');
const somaDias = (dt, n) => { const x = new Date(dt); x.setDate(x.getDate() + n); return x; };

let toastTimer;
function toast(msg, erro) {
  const t = $('#toast');
  t.textContent = msg; t.classList.toggle('erro', !!erro); t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, erro ? 6000 : 2500);
}

/* ---------- semanas: as tarefas são distribuídas nas 6 semanas pelas horas, na ordem do plano ---------- */
function planejar() {
  const total = estado.tarefas.reduce((s, t) => s + t.horas, 0) || 1;
  // a semana vem da planilha do aluno; se faltar em alguma tarefa, distribui pelas horas
  if (estado.tarefas.some((t) => !(t.semana >= 1))) {
    const porSemana = total / SEMANAS;
    let acum = 0;
    estado.tarefas.forEach((t) => {
      if (!(t.semana >= 1)) t.semana = Math.min(SEMANAS, Math.floor((acum + t.horas / 2) / porSemana) + 1);
      acum += t.horas;
    });
  }
  estado.nSem = Math.max(SEMANAS, ...estado.tarefas.map((t) => t.semana));
  estado.total = total;
  estado.intro = estado.blocos.filter((b) => b.num < 0);
  const blocos = estado.blocos.filter((b) => b.num >= 0);
  // tarefas de um bloco que não existe no modelo (ex.: bloco extra criado só para este aluno)
  estado.tarefas.forEach((t) => {
    if (!blocos.some((b) => b.num === t.bloco)) blocos.push({ num: t.bloco, nome: 'Bloco ' + t.bloco, porque_titulo: '', porque: '', resumo: '', entregaveis: [], material: '' });
  });
  estado.blocos = blocos.filter((b) => estado.tarefas.some((t) => t.bloco === b.num)); // bloco sem tarefas no plano do aluno não aparece
  estado.blocos.forEach((b, i) => {
    b.tarefas = estado.tarefas.filter((t) => t.bloco === b.num);
    b.cor = CORES_BLOCO[i % CORES_BLOCO.length];
    b.semanas = [Math.min(...b.tarefas.map((t) => t.semana)), Math.max(...b.tarefas.map((t) => t.semana))];
  });
  const ini = dataISO(estado.inicio);
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  estado.semanaAtual = ini ? Math.floor((hoje - ini) / 864e5 / 7) + 1 : null;
  estado.fracSemana = ini ? (((hoje - ini) / 864e5) % 7 + 1) / 7 : 0;
}
const blocoDe = (t) => estado.blocos.find((b) => b.num === t.bloco) || { nome: 'Bloco ' + t.bloco, cor: '#000' };
function datasSemana(n) {
  const ini = dataISO(estado.inicio);
  if (!ini) return '';
  const de = somaDias(ini, (n - 1) * 7);
  return dd(de) + ' a ' + dd(somaDias(de, 6));
}
const rotuloSemanas = (s) => s[0] === s[1] ? 'Semana ' + s[0] : 'Semanas ' + s[0] + ' a ' + s[1];
const atrasada = (t) => estado.semanaAtual && t.semana < estado.semanaAtual && st(t.id) !== 'done';

/* ---------- material em markdown (vem da planilha) ---------- */
function renderMarkdown(md) {
  if (!md) return '';
  let html;
  if (window.marked && window.DOMPurify) {
    html = DOMPurify.sanitize(marked.parse(md, { mangle: false, headerIds: false }), { ADD_ATTR: ['target'] });
  } else { // sem as bibliotecas: texto simples com links clicáveis
    html = esc(md).replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2">$1</a>').replace(/\n/g, '<br>');
  }
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('a[href]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; });
  return div.innerHTML;
}
const contaLinks = (md) => (String(md || '').match(/\]\(https?:/g) || []).length;

  const sa = estado.semanaAtual;
