  if (sa) {
    const ate = Math.min(sa, N + 1);
    esperado = estado.tarefas.filter((t) => t.semana < ate).reduce((s, t) => s + t.horas, 0)
      + (sa <= N ? estado.tarefas.filter((t) => t.semana === sa).reduce((s, t) => s + t.horas, 0) * estado.fracSemana : 0);
  }
  const diff = esperado == null ? null : hFeitas - esperado;
  const faixa = !sa ? estado.tarefas.length + ' tarefas' : sa < 1 ? 'Começa em ' + dd(dataISO(estado.inicio)) : sa > N ? 'Prazo do plano encerrado' : 'Semana ' + sa + ' de ' + N;

  let html = '<section class="hero"><div><p class="kicker">Engenharia de Dados · ' + esc(estado.nivel) + '</p>'
    + '<h1>' + (nome ? esc(nome) + ', seu plano de <em>' + N + ' semanas</em>' : 'Seu plano de <em>' + N + ' semanas</em>') + '</h1>'
    + '<p>Cada bloco tem um porquê, um entregável e o material com os links. Mova as tarefas no board conforme você avança: o que você marca aqui a mentoria acompanha.</p></div>'
    + '<span class="faixa">' + esc(faixa) + '</span></section>';

  html += '<section class="numeros" aria-label="Resumo">'
    + num('Progresso', pct + '%', feitas.length + ' de ' + estado.tarefas.length + ' tarefas feitas')
    + num('Horas', fmtH(hFeitas).replace(' h', ''), 'de ' + fmtH(estado.total) + ' · cerca de ' + fmtH(estado.total / N) + ' por semana')
    + (diff == null ? num('Ritmo', '—', 'a data de início ainda não foi definida')
      : diff >= -1 ? num('Ritmo', 'No ritmo', diff > 1 ? fmtH(diff) + ' adiantado' : 'você está em dia', false, true)
        : num('Ritmo', fmtH(-diff), 'atrás do planejado até hoje', true))
    + num('Semana', sa && sa >= 1 && sa <= N ? sa + '/' + N : sa > N ? 'Fim' : '—', sa && sa >= 1 && sa <= N ? datasSemana(sa) : 'do plano de ' + N + ' semanas')
    + '</section>';

  html += '<section class="semanas" aria-label="Semanas">' + Array.from({ length: N }, (_, i) => i + 1).map((n) => {
    const ts = estado.tarefas.filter((t) => t.semana === n);
    const h = ts.reduce((s, t) => s + t.horas, 0);
    const hf = ts.filter((t) => st(t.id) === 'done').reduce((s, t) => s + t.horas, 0);
    return '<button type="button" class="sem' + (n === sa ? ' atual' : '') + '" data-semana="' + n + '" aria-pressed="' + (estado.semana === String(n)) + '">'
      + '<b>Semana ' + n + '</b><small>' + (datasSemana(n) ? datasSemana(n) + ' · ' : '') + fmtH(h) + '</small>'
      + '<span class="sem-barra"><i style="width:' + (h ? Math.round(hf / h * 100) : 0) + '%"></i></span></button>';
  }).join('') + '</section>';

  const semOpcoes = '<option value="agora"' + (estado.semana === 'agora' ? ' selected' : '') + '>' + (sa ? 'Esta semana e atrasadas' : 'Semana 1') + '</option>'
    + '<option value=""' + (estado.semana === '' ? ' selected' : '') + '>Todas as semanas</option>'
    + Array.from({ length: N }, (_, i) => '<option value="' + (i + 1) + '"' + (estado.semana === String(i + 1) ? ' selected' : '') + '>Semana ' + (i + 1) + '</option>').join('');
  html += '<div class="barra-abas"><div class="abas" role="tablist"><button type="button" role="tab" data-aba="backlog" aria-selected="' + (estado.aba === 'backlog') + '">Backlog</button>'
    + '<button type="button" role="tab" data-aba="board" aria-selected="' + (estado.aba === 'board') + '">Board</button></div>'
    + (estado.aba === 'board' ? '<label for="f-semana">Semana <select id="f-semana">' + semOpcoes + '</select></label>' : '')
    + '<label for="f-bloco">Bloco <select id="f-bloco"><option value="">Todos</option>' + estado.blocos.map((b) => '<option value="' + b.num + '"' + (String(b.num) === estado.bloco ? ' selected' : '') + '>Bloco ' + b.num + ' · ' + esc(b.nome) + '</option>').join('') + '</select></label></div>';

  html += estado.aba === 'board' ? board() : backlog();
  $('#conteudo').innerHTML = html;
}

function num(rotulo, valor, sub, alerta, ok) {
  return '<div class="num' + (alerta ? ' num--alerta' : ok ? ' num--ok' : '') + '"><span>' + rotulo + '</span><b>' + esc(valor) + '</b><small>' + esc(sub) + '</small></div>';
}

function filtradas() {
  const sa = estado.semanaAtual;
  return estado.tarefas.filter((t) => {
    if (estado.bloco && String(t.bloco) !== estado.bloco) return false;
    if (estado.aba !== 'board' || estado.semana === '') return true;
    if (estado.semana === 'agora') {
      const ref = sa ? Math.max(1, Math.min(sa, estado.nSem || SEMANAS)) : 1;
      return t.semana === ref || (t.semana < ref && st(t.id) !== 'done') || st(t.id) === 'doing';
    }
    return String(t.semana) === estado.semana;
  });
}

function cartao(t) {
  const b = blocoDe(t);
  const s = st(t.id);
  return '<button type="button" class="card' + (s === 'done' ? ' feito' : '') + '" data-id="' + esc(t.id) + '" style="--c:' + b.cor + '">'
    + '<span class="card-topo"><span>' + esc(t.id) + ' · Semana ' + t.semana + '</span><span>' + fmtH(t.horas) + '</span></span>'
    + '<b>' + esc(t.titulo) + '</b>'
    + '<span class="chips"><span class="chip chip--bloco">Bloco ' + b.num + '</span>'
    + (t.tipo === 'checkpoint' ? '<span class="chip chip--check">Checkpoint</span>' : '<span class="chip">' + esc(TIPOS[t.tipo] || t.tipo) + '</span>')
    + (/revis/i.test(t.depende) ? '<span class="chip chip--rev">Revisão da Alana</span>' : '')
    + (atrasada(t) ? '<span class="chip chip--atr">Atrasada</span>' : '') + '</span></button>';
}

function board() {
  const ts = filtradas();
  return '<p class="dica">Arraste a tarefa para outra coluna, ou toque nela para ver os detalhes e mudar o status.</p><section class="board" id="board">'
    + STATUS.map((c) => {
      const lista = ts.filter((t) => st(t.id) === c.id);
      return '<div class="coluna" data-status="' + c.id + '"><div class="coluna-cab"><span>' + c.nome + '</span><span class="conta">' + lista.length + '</span></div>'
        + '<div class="coluna-corpo" data-status="' + c.id + '">' + (lista.length ? lista.map(cartao).join('') : '<p class="vazio">Nada aqui.</p>') + '</div></div>';
    }).join('') + '</section>';
}

function backlog() {
  const blocos = estado.blocos.filter((b) => !estado.bloco || String(b.num) === estado.bloco);
  const sa = estado.semanaAtual;
  const intro = estado.bloco ? '' : (estado.intro || []).map((b) => '<details class="intro"><summary><small>Sobre o plano</small>' + esc(b.nome) + '</summary>'
    + '<div class="material">' + renderMarkdown(b.material) + '</div></details>').join('');
  return '<section class="backlog">' + intro + blocos.map((b) => {
    const h = b.tarefas.reduce((s, t) => s + t.horas, 0);
    const feitas = b.tarefas.filter((t) => st(t.id) === 'done');
    const pct = b.tarefas.length ? Math.round(feitas.length / b.tarefas.length * 100) : 0;
    const aberto = estado.bloco || (sa && b.semanas[0] <= sa && b.semanas[1] >= sa) || (!sa && b === estado.blocos[0]);
    return '<details class="epico" style="--c:' + b.cor + '"' + (aberto ? ' open' : '') + '><summary>'
      + '<h2 class="epico-nome"><small>Bloco ' + b.num + ' · ' + rotuloSemanas(b.semanas) + '</small>' + esc(b.nome) + '</h2>'
      + '<span class="epico-meta"><span>' + feitas.length + '/' + b.tarefas.length + ' tarefas · ' + fmtH(h) + '</span><span class="prog"><i style="width:' + pct + '%"></i></span></span></summary>'
      + '<div class="epico-corpo"><div class="porque"><section><h3>' + esc(b.porque_titulo || 'Por que esse bloco existe') + '</h3><p>' + esc(b.porque) + '</p></section>'
      + '<section><h3>O que você vai entregar</h3>' + (b.entregaveis.length ? '<ul>' + b.entregaveis.map((e) => '<li>' + esc(e) + '</li>').join('') + '</ul>' : '<p>' + esc(b.resumo) + '</p>') + '</section></div>'
      + (b.material ? '<details class="material-box" id="material-' + b.num + '"' + (estado.abrirMaterial === b.num ? ' open' : '') + '><summary><span class="mb-titulo">Material do bloco: passo a passo e links' + (contaLinks(b.material) ? ' (' + contaLinks(b.material) + ')' : '') + '</span>'
        + '<span class="mb-acao" data-fechado="Clique aqui para ver os detalhes do bloco ▾" data-aberto="Clique aqui para esconder ▴"></span></summary>'
        + '<div class="material">' + renderMarkdown(b.material) + '</div></details>' : '')
      + '<ul class="tarefas">' + b.tarefas.map((t) => {
        const s = st(t.id);
        return '<li><button type="button" class="tarefa' + (s === 'done' ? ' feito' : '') + '" data-id="' + esc(t.id) + '">'
          + '<span class="st st-' + s + '">' + STATUS.find((x) => x.id === s).nome + '</span><span class="t-id">' + esc(t.id) + '</span>'
          + '<span class="t-tit">' + esc(t.titulo) + (atrasada(t) ? ' <span class="chip chip--atr">Atrasada</span>' : '') + (/revis/i.test(t.depende) ? ' <span class="chip chip--rev">Revisão da Alana</span>' : '') + '</span>'
          + '<span class="t-meta t-tipo">' + esc(TIPOS[t.tipo] || t.tipo) + '</span><span class="t-meta">' + fmtH(t.horas) + '</span><span class="t-meta t-sem">Semana ' + t.semana + '</span></button></li>';
      }).join('') + '</ul></div></details>';
  }).join('') + '</section>';
}

/* ---------- detalhe da tarefa ---------- */
const dlg = $('#detalhe');
function abrirDetalhe(id) {
  const t = estado.tarefas.find((x) => x.id === id);
  if (!t) return;
  const b = blocoDe(t);
  $('#det').innerHTML = '<p class="kicker">' + esc(t.id) + ' · Bloco ' + b.num + ' · ' + esc(b.nome) + '</p><h2>' + esc(t.titulo) + '</h2>'
    + '<dl><dt>Tipo</dt><dd>' + esc(TIPOS[t.tipo] || t.tipo) + '</dd><dt>Tempo esperado</dt><dd>' + fmtH(t.horas) + '</dd>'
    + '<dt>Semana</dt><dd>Semana ' + t.semana + (datasSemana(t.semana) ? ' (' + datasSemana(t.semana) + ')' : '') + (atrasada(t) ? ' · <span class="chip chip--atr">Atrasada</span>' : '') + '</dd>'
    + (t.pronto ? '<dt>Pronto quando</dt><dd>' + esc(t.pronto) + '</dd>' : '')
    + (t.depende ? '<dt>Depende de</dt><dd>' + esc(t.depende) + (/revis/i.test(t.depende) ? '. Quando terminar, avise a equipe para a Alana revisar.' : '') + '</dd>' : '')
    + '</dl><div class="opcoes" role="group" aria-label="Status">' + STATUS.map((s) => '<button type="button" data-st="' + s.id + '" aria-pressed="' + (st(t.id) === s.id) + '">' + s.nome + '</button>').join('') + '</div>'
    + (b.material ? '<button type="button" class="btn-link" id="det-material" data-bloco="' + b.num + '">Ver o material do Bloco ' + b.num + ' (passo a passo e links)</button>' : '')
    + '<div class="det-acoes"><button class="btn" type="button" id="det-fechar">Fechar</button></div>';
  dlg.dataset.id = id;
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
}
function fecharDetalhe() { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
$('#det').addEventListener('click', (e) => {
  if (e.target.id === 'det-fechar') { fecharDetalhe(); return; }
  if (e.target.id === 'det-material') {
    const n = Number(e.target.dataset.bloco);
    fecharDetalhe();
    estado.aba = 'backlog'; estado.abrirMaterial = n; render(); estado.abrirMaterial = null;
    const alvo = document.getElementById('material-' + n);
    if (alvo) { alvo.closest('.epico').open = true; alvo.scrollIntoView({ block: 'start' }); }
    return;
  }
  const b = e.target.closest('[data-st]');
  if (b) { mudarStatus(dlg.dataset.id, b.dataset.st); fecharDetalhe(); }
});

function mudarStatus(id, novo) {
  if (st(id) === novo) return;
  const anterior = copiar(estado.status);
  if (novo === 'todo') delete estado.status[id]; else estado.status[id] = novo;
  render();
  const t = estado.tarefas.find((x) => x.id === id);
  salvar(anterior, (t ? t.id : '') + ' → ' + STATUS.find((s) => s.id === novo).nome);
}

/* ---------- arrastar (mouse e toque) ---------- */
let drag = null, ignorarClique = false;
document.addEventListener('pointerdown', (e) => {
  const card = e.target.closest('#board .card');
  if (!card || e.button > 0) return;
  const r = card.getBoundingClientRect();
  drag = { id: card.dataset.id, card, x0: e.clientX, y0: e.clientY, dx: e.clientX - r.left, dy: e.clientY - r.top, w: r.width, h: r.height, ativo: false, tipo: e.pointerType };
  document.addEventListener('pointermove', mover);
  document.addEventListener('pointerup', soltar);
  document.addEventListener('pointercancel', cancelar);
});
function mover(e) {
  if (!drag) return;
  const dist = Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0);
  if (!drag.ativo) {
    // no toque, só arrasta com movimento mais horizontal (o vertical rola a página)
    if (dist < 8 || (drag.tipo === 'touch' && Math.abs(e.clientY - drag.y0) > Math.abs(e.clientX - drag.x0))) { if (drag.tipo === 'touch' && dist >= 8) limpar(); return; }
    drag.ativo = true;
    drag.fantasma = drag.card.cloneNode(true);
    drag.fantasma.classList.add('fantasma');
    drag.fantasma.style.width = drag.w + 'px';
    document.body.appendChild(drag.fantasma);
    drag.ph = document.createElement('div'); drag.ph.className = 'ph'; drag.ph.style.height = drag.h + 'px';
    drag.card.parentNode.insertBefore(drag.ph, drag.card);
    drag.card.hidden = true;
    document.body.classList.add('arrastando');
  }
  e.preventDefault();
  drag.fantasma.style.left = (e.clientX - drag.dx) + 'px';
  drag.fantasma.style.top = (e.clientY - Math.min(drag.dy, 30)) + 'px';
  const alvo = document.elementFromPoint(e.clientX, e.clientY);
  const corpo = alvo && alvo.closest('.coluna') && alvo.closest('.coluna').querySelector('.coluna-corpo');
  if (corpo && drag.ph.parentNode !== corpo) { const v = corpo.querySelector('.vazio'); if (v) v.hidden = true; corpo.appendChild(drag.ph); }
  if (e.clientY < 60) window.scrollBy(0, -12); else if (e.clientY > innerHeight - 60) window.scrollBy(0, 12);
}
function limpar() {
  document.removeEventListener('pointermove', mover);
  document.removeEventListener('pointerup', soltar);
  document.removeEventListener('pointercancel', cancelar);
  document.body.classList.remove('arrastando');
  if (drag && drag.fantasma) drag.fantasma.remove();
  if (drag && drag.ph) drag.ph.remove();
  if (drag && drag.card) drag.card.hidden = false;
  drag = null;
}
function soltar() {
  if (!drag) return;
  if (!drag.ativo) { limpar(); return; } // foi um toque/clique: o evento de clique abre o detalhe
  const novo = drag.ph.parentNode && drag.ph.parentNode.dataset.status;
  const id = drag.id;
  ignorarClique = true; setTimeout(() => { ignorarClique = false; }, 50);
  limpar();
  if (novo) mudarStatus(id, novo); else render();
}
function cancelar() { limpar(); render(); }

/* ---------- dados ---------- */
async function carregar() {
  if (DEMO) { aplicar(copiar(DEMO_DADOS)); return; }
  if (!ID) { mostrarEstado('Este link está incompleto. Use o link do plano que a equipe da mentoria enviou.'); return; }
  mostrarEstado('Carregando seu plano de estudos…');
  try {
    const r = await fetch(API_URL + '?plano=1&j=' + encodeURIComponent(ID));
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'Resposta inválida.');
    if (!d.pronto) { mostrarEstado('Seu plano de estudos está sendo preparado pela equipe da mentoria. Assim que ele estiver pronto, ele aparece aqui, neste mesmo link.'); return; }
    aplicar(d);
  } catch (e) {
    mostrarEstado('Não foi possível abrir seu plano. ' + (e.message || '') + ' Recarregue a página ou fale com a equipe da mentoria.');
  }
}
function aplicar(d) {
  estado.aluno = d.aluno || {}; estado.nivel = d.nivel || ''; estado.inicio = d.inicio || '';
  estado.blocos = d.blocos || []; estado.tarefas = (d.tarefas || []).map((t) => Object.assign({}, t, { horas: Number(t.horas) || 0 }));
  estado.status = d.estado || {};
  planejar();
  render();
}
async function salvar(anterior, msg) {
  if (DEMO) { toast(msg + ' · demonstração'); return; }
  $('#salvando').hidden = false;
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: 'salvarPlano', j: ID, estado: estado.status }) });
    const d = await r.json();
    if (!d.ok) throw new Error(d.erro || 'Erro desconhecido.');
    toast(msg + ' · salvo');
  } catch (e) {
    estado.status = anterior; render();
    toast('Não salvou: ' + (e.message || 'sem conexão') + ' A mudança foi desfeita.', true);
  } finally { $('#salvando').hidden = true; }
}

/* ---------- eventos ---------- */
$('#conteudo').addEventListener('click', (e) => {
  const aba = e.target.closest('[data-aba]');
  if (aba) { estado.aba = aba.dataset.aba; render(); return; }
  const sem = e.target.closest('[data-semana]');
  if (sem) { estado.aba = 'board'; estado.semana = estado.semana === sem.dataset.semana ? 'agora' : sem.dataset.semana; render(); return; }
  if (ignorarClique) return;
  const c = e.target.closest('[data-id]');
  if (c) abrirDetalhe(c.dataset.id);
});
$('#conteudo').addEventListener('change', (e) => {
  if (e.target.id === 'f-semana') { estado.semana = e.target.value; render(); }
  if (e.target.id === 'f-bloco') { estado.bloco = e.target.value; render(); }
});

carregar();
</script>
</body>
</html>
