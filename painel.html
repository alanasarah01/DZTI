  const dlg = $('#ficha');
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  dlg.scrollTop = 0;
  dlg.querySelectorAll('textarea.auto').forEach(ajustarAltura);
}
/* Caixa de nota cresce com o texto (até o limite; depois rola). */
function ajustarAltura(t) { t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight + 3, 480) + 'px'; }
document.addEventListener('input', (e) => { if (e.target.matches && e.target.matches('textarea.auto')) ajustarAltura(e.target); });
function fecharFicha() { const dlg = $('#ficha'); if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); fichaIdx = null; }

function valorAtual(a, k) { return ['email', 'objetivo', 'inicio'].includes(k) ? (a[k] || '') : d(a, k); }
async function salvarFicha() {
  const a = estado.alunos[fichaIdx];
  if (!a) return;
  const mudou = {};
  $('#form-ficha').querySelectorAll('[data-k]').forEach((el) => {
    const k = el.dataset.k;
    const v = el.type === 'checkbox' ? el.checked : el.value.trim();
    const antes = valorAtual(a, k);
    if (el.type === 'checkbox' ? v !== (antes === true) : v !== String(antes || '')) mudou[k] = v;
  });
  if (!Object.keys(mudou).length) { fecharFicha(); toast('Nada foi alterado'); return; }
  const ok = await gravarAluno(a, mudou);
  if (ok) fecharFicha();
}

async function gravarAluno(a, campos) {
  const antes = JSON.parse(JSON.stringify({ dados: a.dados, email: a.email, objetivo: a.objetivo, inicio: a.inicio }));
  Object.keys(campos).forEach((k) => { if (['email', 'objetivo', 'inicio'].includes(k)) a[k] = campos[k]; else a.dados[k] = campos[k]; });
  render();
  if (DEMO) { toast('Salvo · demonstração, nada foi gravado'); return true; }
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: 'salvarAluno', senha: estado.senha, linha: a.linha, nome: a.nome, campos }) });
    const res = await r.json();
    if (!res.ok) throw new Error(res.erro === 'senha' ? 'senha incorreta' : res.erro);
    toast('Salvo na planilha · ' + a.nome);
    return true;
  } catch (e) {
    Object.assign(a, { email: antes.email, objetivo: antes.objetivo, inicio: antes.inicio, dados: antes.dados });
    render();
    toast('Não salvou: ' + (e.message || 'sem conexão') + '. A mudança foi desfeita.', true);
    return false;
  }
}

/* ---------- dados ---------- */
function aplicar(alunos) {
  estado.alunos = (alunos || []).map((a) => Object.assign({ dados: {} }, a, { cards: a.erro || !a.cards ? [] : normalizarCards(a.cards) }));
  estado.carregadoEm = new Date();
  render();
}
async function buscar(senha, forcar) {
  if (DEMO) {
    if (senha !== SENHA_DEMO) throw new Error('senha');
    return JSON.parse(JSON.stringify(DEMO_DADOS));
  }
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: 'painel', senha, forcar: !!forcar }) });
  const res = await r.json();
  if (!res.ok) throw new Error(res.erro || 'Erro desconhecido.');
  return res.alunos;
}
function guardarSenha(s) { try { if (s) sessionStorage.setItem('dzti-senha', s); else sessionStorage.removeItem('dzti-senha'); } catch (_) {} }
function lerSenha() { try { return sessionStorage.getItem('dzti-senha') || ''; } catch (_) { return ''; } }

async function entrar(senha, silencioso) {
  const btn = $('#btn-entrar');
  btn.disabled = true; btn.textContent = 'Carregando…';
  $('#login-erro').hidden = true;
  try {
    const alunos = await buscar(senha);
    estado.senha = senha;
    guardarSenha(senha);
    $('#login').hidden = true; $('#painel').hidden = false; $('#acoes').hidden = false;
    aplicar(alunos);
  } catch (e) {
    guardarSenha('');
    $('#login').hidden = false;
    if (!silencioso) {
      $('#login-erro').textContent = e.message === 'senha' ? (DEMO ? 'Senha incorreta. Na demonstração, a senha é dzti.' : 'Senha incorreta.') : 'Não foi possível carregar: ' + e.message;
      $('#login-erro').hidden = false;
    }
  } finally { btn.disabled = false; btn.textContent = 'Entrar'; }
}
async function atualizar() {
  if (estado.visao === 'tarefas' && tq.carregado) { await tqAtualizar(false); return; }
  const b = $('#btn-atualizar');
  b.disabled = true; b.textContent = 'Atualizando…';
  try { aplicar(await buscar(estado.senha, true)); toast('Painel atualizado'); }
  catch (e) {
    if (e.message === 'senha') { sair(); toast('A senha mudou. Entre de novo.', true); }
    else toast('Não foi possível atualizar: ' + e.message, true);
  } finally { b.disabled = false; b.textContent = 'Atualizar'; }
}
function sair() {
  guardarSenha('');
  estado.senha = ''; estado.alunos = [];
  if (typeof tq !== 'undefined') Object.assign(tq, { tarefas: [], carregado: false, fila: [], abertaNova: null });
  $('#painel').hidden = true; $('#acoes').hidden = true; $('#login').hidden = false;
  $('#senha').value = '';
}

async function alternarItem(btn) {
  const a = estado.alunos[Number(btn.dataset.a)];
  if (!a) return;
  const card = a.cards.find((c) => c.id === btn.dataset.c);
  const item = card && card[btn.dataset.g][Number(btn.dataset.i)];
  if (!item) return;
  item.feito = !item.feito; item.marcadoAgora = true;
  render();
  if (DEMO) { toast((item.feito ? 'Feito' : 'Reaberto') + ' · demonstração, nada foi gravado'); return; }
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: 'salvar', j: a.j, senha: estado.senha, cards: a.cards.map(paraPlanilha) }) });
    const res = await r.json();
    if (!res.ok) throw new Error(res.erro === 'senha' ? 'senha incorreta' : res.erro);
    toast((item.feito ? 'Feito' : 'Reaberto') + ' · salvo na planilha de ' + a.nome);
  } catch (e) {
    item.feito = !item.feito; render();
    toast('Não salvou: ' + (e.message || 'sem conexão') + '. A mudança foi desfeita.', true);
  }
}

/* ---------- eventos ---------- */
$('#login').addEventListener('submit', (e) => { e.preventDefault(); entrar($('#senha').value); });
$('#btn-atualizar').addEventListener('click', atualizar);
$('#btn-sair').addEventListener('click', sair);
$('#abas').addEventListener('click', (e) => { const b = e.target.closest('[data-visao]'); if (b) irPara(b.dataset.visao); });
$('#f-programa').addEventListener('change', (e) => { estado.programa = e.target.value; render(); });
$('#f-status').addEventListener('change', (e) => { estado.status = e.target.value; render(); });
$('#busca').addEventListener('input', (e) => { estado.busca = e.target.value; render(); });
$('#limpar').addEventListener('click', () => {
  estado.programa = ''; estado.status = 'acomp'; estado.busca = ''; estado.filtroResp = null;
  $('#f-programa').value = ''; $('#f-status').value = 'acomp'; $('#busca').value = ''; render();
});
$('#visao').addEventListener('click', (e) => {
  const r = e.target.closest('.resp');
  if (r) { estado.filtroResp = estado.filtroResp === r.dataset.resp ? null : r.dataset.resp; render(); return; }
  const it = e.target.closest('.item');
  if (it) { alternarItem(it); return; }
  const ac = e.target.closest('.acb');
  if (ac) { const a = estado.alunos[+ac.dataset.a]; gravarAluno(a, { ['ac' + ac.dataset.ac]: d(a, 'ac' + ac.dataset.ac) !== true }); return; }
  const f = e.target.closest('[data-ficha]');
  if (f) abrirFicha(+f.dataset.ficha);
});
$('#visao').addEventListener('change', (e) => { if (e.target.id === 'so-pendentes') { estado.soPendentes = e.target.checked; render(); } });
$('#form-ficha').addEventListener('click', (e) => {
  if (e.target.id === 'ficha-fechar') fecharFicha();
  if (e.target.id === 'ficha-salvar') salvarFicha();
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== estado.visao && !$('#painel').hidden) irPara(h); });


/* =========================================================
   TAREFAS DA EQUIPE: quadro de cards (Para não esquecer, Em andamento, Concluído)
   Planilha própria "Tarefas da Equipe DZTI"; a API usa a mesma senha do painel.
   ========================================================= */
const TQ_COLUNAS = [
  { nome: 'Para não esquecer', cor: '#9a8f88' },
  { nome: 'Em andamento', cor: '#344c92' },
  { nome: 'Concluído', cor: '#2f6b4f' },
];
const TQ_PESSOAS = ['Larissa', 'Alana', 'Maiara'];
const TQ_DIAS_CONCLUIDO = 14;
const TQ_DEMO = [];
const tqLer = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (_) { return d; } };
const tq = { tarefas: [], carregado: false, carregando: false, pessoa: tqLer('dzti-tarefas-pessoa', ''), busca: '', verAntigos: false, abertaNova: null, editando: null, planilha: '', fila: [], enviando: false, sync: 0 };

function tqTagPrazo(t) {
  if (!t.prazo) return '';
  if (t.coluna === 'Concluído') return '<span class="tq-tag">' + fmt(t.prazo, true) + '</span>';
  const h = hojeISO();
  if (t.prazo < h) return '<span class="tq-tag tq-tag--atr">Atrasada · ' + fmt(t.prazo, true) + '</span>';
  if (t.prazo === h) return '<span class="tq-tag tq-tag--hoje">Hoje</span>';
  return '<span class="tq-tag">Até ' + fmt(t.prazo, true) + '</span>';
}
function tqVisivel(t) {
  if (tq.pessoa === '-' && t.responsavel) return false;
  if (tq.pessoa && tq.pessoa !== '-' && t.responsavel !== tq.pessoa) return false;
  if (tq.busca && !(t.titulo + ' ' + t.notas + ' ' + t.responsavel).toLowerCase().includes(tq.busca.toLowerCase())) return false;
  return true;
}
const tqDaColuna = (nome) => tq.tarefas.filter((t) => t.coluna === nome).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
const tqRecente = (t) => !t.concluidoEm || (Date.now() - new Date(t.concluidoEm).getTime()) / 864e5 <= TQ_DIAS_CONCLUIDO;

function visaoTarefas() {
  const pessoas = [['', 'Todas'], ...TQ_PESSOAS.map((p) => [p, p]), ['-', 'Sem responsável']];
  return '<div class="tq-barra"><span class="rot">Mostrar</span><div class="tq-pessoas" role="group" aria-label="Filtrar por responsável">'
    + pessoas.map(([v, r]) => '<button type="button" class="tq-pessoa" data-tq-pessoa="' + esc(v) + '" aria-pressed="' + (tq.pessoa === v) + '">' + esc(r) + '</button>').join('') + '</div>'
    + '<span class="tq-status" id="tq-status" role="status" aria-live="polite"></span>'
    + '<a id="tq-planilha" target="_blank" rel="noopener"' + (tq.planilha ? ' href="' + esc(tq.planilha) + '"' : ' hidden') + '>Abrir planilha ↗</a>'
    + '<input class="busca" id="tq-busca" type="search" placeholder="Buscar tarefa" aria-label="Buscar tarefa" value="' + esc(tq.busca) + '"></div>'
    + '<div class="tq-quadro" id="tq-quadro">' + tqQuadroHTML() + '</div>';
}
function tqCardHTML(t) {
  const meta = (t.responsavel ? '<span class="tq-tag">' + esc(t.responsavel) + '</span>' : '') + tqTagPrazo(t) + (String(t.notas).trim() ? '<span class="tq-tag tq-tag--nota">Notas</span>' : '');
  return '<li class="tq-card" tabindex="0" data-tq-id="' + esc(t.id) + '" aria-label="' + esc(t.titulo) + '. Enter para abrir."><h3>' + esc(t.titulo) + '</h3><div class="tq-meta">' + meta + '</div></li>';
}
function tqQuadroHTML() {
  if (!tq.carregado) return '<p class="tq-vazio">' + (tq.carregando ? 'Carregando tarefas…' : '') + '</p>';
  return TQ_COLUNAS.map((c) => {
    let lista = tqDaColuna(c.nome).filter(tqVisivel), escondidos = 0;
    if (c.nome === 'Concluído' && !tq.verAntigos) { const r = lista.filter(tqRecente); escondidos = lista.length - r.length; lista = r; }
    const nova = tq.abertaNova === c.nome
      ? '<form class="tq-form-nova" data-col="' + esc(c.nome) + '"><textarea name="titulo" maxlength="300" placeholder="Título da tarefa" aria-label="Título da nova tarefa" required></textarea>'
        + '<div class="linha"><button class="btn btn--preto" type="submit">Adicionar</button><button class="btn" type="button" data-tq-fechar-nova>Cancelar</button><span class="dica">Enter adiciona</span></div></form>'
      : '<button type="button" class="abre" data-tq-nova="' + esc(c.nome) + '">+ Nova tarefa</button>';
    return '<section class="tq-col" data-col="' + esc(c.nome) + '" style="--c:' + c.cor + '" aria-label="' + esc(c.nome) + '">'
      + '<div class="tq-topo"><span class="bola" aria-hidden="true"></span><h2>' + esc(c.nome) + '</h2><span class="qtd">' + (lista.length + escondidos) + '</span></div>'
      + '<ul class="tq-lista" data-col="' + esc(c.nome) + '">' + (lista.length ? lista.map(tqCardHTML).join('') : '<li class="tq-vazio">' + (tq.busca || tq.pessoa ? 'Nada com esse filtro.' : 'Nenhuma tarefa aqui.') + '</li>') + '</ul>'
      + (escondidos ? '<button type="button" class="tq-mais" data-tq-antigos>Mostrar ' + escondidos + ' concluída' + (escondidos > 1 ? 's' : '') + ' há mais de ' + TQ_DIAS_CONCLUIDO + ' dias</button>' : '')
      + (c.nome === 'Concluído' && tq.verAntigos ? '<button type="button" class="tq-mais" data-tq-antigos>Esconder concluídas antigas</button>' : '')
      + '<div class="tq-nova">' + nova + '</div></section>';
  }).join('');
}
/* redesenha só o quadro (a barra com a busca fica, para não perder o foco) */
function tqRender() {
  const q = document.getElementById('tq-quadro');
  if (!q) return;
  q.innerHTML = tqQuadroHTML();
  document.querySelectorAll('[data-tq-pessoa]').forEach((b) => b.setAttribute('aria-pressed', String(tq.pessoa === b.dataset.tqPessoa)));
  if (tq.carregado) $('#kicker').textContent = tq.tarefas.filter((t) => t.coluna !== 'Concluído').length + ' tarefas abertas';
  const pl = document.getElementById('tq-planilha'); if (pl && tq.planilha) { pl.href = tq.planilha; pl.hidden = false; }
  if (tq.abertaNova) { const ta = document.querySelector('.tq-form-nova textarea'); if (ta) ta.focus(); }
}
function tqStatus(txt, erro) { const s = document.getElementById('tq-status'); if (s) { s.textContent = txt; s.classList.toggle('erro', !!erro); } }
const tqHora = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

async function tqChamar(ops) {
  if (DEMO) { await new Promise((r) => setTimeout(r, 120)); return JSON.parse(JSON.stringify(tq.tarefas)); }
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ acao: 'tarefas', senha: estado.senha, ops: ops || [] }) });
  const res = await r.json();
  if (!res.ok) throw new Error(res.erro === 'senha' ? 'senha' : res.erro || 'erro');
  if (res.planilha) tq.planilha = res.planilha;
  return res.tarefas || [];
}
function tqAplicar(tarefas) {
  tq.tarefas = tarefas.map((t) => Object.assign({ notas: '', responsavel: '', prazo: '', concluidoEm: '' }, t));
  tq.carregado = true; tq.sync = Date.now();
  if (!tqArraste && !$('#tq-dlg').open && !tq.abertaNova) tqRender();
}
async function tqCarregar() {
  tq.carregando = true;
  try {
    tqAplicar(DEMO ? JSON.parse(JSON.stringify(TQ_DEMO)) : await tqChamar([]));
    tqStatus(DEMO ? 'Demonstração' : 'Atualizado ' + tqHora());
  } catch (e) {
    if (e.message === 'senha') { sair(); toast('A senha mudou. Entre de novo.', true); }
    else { const q = document.getElementById('tq-quadro'); if (q) q.innerHTML = '<p class="vazio">Não foi possível carregar as tarefas: ' + esc(e.message) + '. Clique em Atualizar.</p>'; }
  } finally { tq.carregando = false; }
}
async function tqAtualizar(silencioso) {
  if (!estado.senha || !tq.carregado || tq.enviando || tq.fila.length || tqArraste || $('#tq-dlg').open || tq.abertaNova) return;
  try { tqAplicar(await tqChamar([])); tqStatus('Atualizado ' + tqHora()); if (!silencioso) toast('Tarefas atualizadas'); }
  catch (e) { if (e.message === 'senha') { sair(); toast('A senha mudou. Entre de novo.', true); } else if (!silencioso) toast('Não foi possível atualizar: ' + e.message, true); }
}
function tqEnfileirar(op) { tq.fila.push(op); tqEnviar(); }
async function tqEnviar() {
  if (tq.enviando || !tq.fila.length) return;
  tq.enviando = true; tqStatus('Salvando…');
  const ops = tq.fila.splice(0, tq.fila.length);
  try {
    const tarefas = await tqChamar(ops);
    if (!tq.fila.length) tqAplicar(tarefas);
    tqStatus(DEMO ? 'Demonstração · nada é gravado' : 'Salvo ' + tqHora());
  } catch (e) {
    if (e.message === 'senha') { sair(); toast('A senha mudou. Entre de novo.', true); }
    else { tqStatus('Não salvou', true); toast('Não foi possível salvar: ' + e.message + '. Clique em Atualizar e tente de novo.', true); }
  } finally { tq.enviando = false; if (tq.fila.length) tqEnviar(); }
}
const tqNovoId = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function tqCriar(coluna, titulo) {
  const t = { id: tqNovoId(), titulo: titulo.trim(), coluna, ordem: tqDaColuna(coluna).length + 1, responsavel: tq.pessoa && tq.pessoa !== '-' ? tq.pessoa : '', prazo: '', notas: '', concluidoEm: coluna === 'Concluído' ? new Date().toISOString() : '' };
  tq.tarefas.push(t);
  tqEnfileirar({ tipo: 'salvar', tarefa: t });
}
function tqMover(id, coluna, indice) {
  const t = tq.tarefas.find((x) => x.id === id); if (!t) return;
  const destino = tqDaColuna(coluna).filter((x) => x.id !== id);
  destino.splice(Math.max(0, Math.min(indice, destino.length)), 0, t);
  if (t.coluna !== coluna) t.concluidoEm = coluna === 'Concluído' ? new Date().toISOString() : '';
  t.coluna = coluna;
  destino.forEach((x, i) => { x.ordem = i + 1; });
  tqRender();
  tqEnfileirar({ tipo: 'mover', id, coluna, ordem: destino.map((x) => x.id) });
}

/* arrastar com mouse e toque (no toque, segure um instante antes de arrastar) */
let tqArraste = null, tqUltimoArraste = 0;
document.addEventListener('pointerdown', (e) => {
  const card = e.target.closest('.tq-card');
  if (!card || e.button > 0) return;
  tqArraste = { card, id: card.dataset.tqId, x0: e.clientX, y0: e.clientY, ativo: false, pid: e.pointerId, tipo: e.pointerType, t0: Date.now() };
});
document.addEventListener('pointermove', (e) => {
  const a = tqArraste;
  if (!a || e.pointerId !== a.pid) return;
  const dx = e.clientX - a.x0, dy = e.clientY - a.y0;
  if (!a.ativo) {
    if (a.tipo === 'touch' && Date.now() - a.t0 < 280) { if (Math.hypot(dx, dy) > 8) tqArraste = null; return; }
    if (Math.hypot(dx, dy) < 6) return;
    const r = a.card.getBoundingClientRect();
    const voando = a.card.cloneNode(true);
    voando.classList.add('voando'); voando.style.width = r.width + 'px';
    document.body.appendChild(voando);
    a.card.classList.add('fantasma');
    Object.assign(a, { ativo: true, voando, ox: e.clientX - r.left, oy: e.clientY - r.top });
    document.body.classList.add('arrastando');
  }
  e.preventDefault();
  a.voando.style.left = (e.clientX - a.ox) + 'px';
  a.voando.style.top = (e.clientY - a.oy) + 'px';
  document.querySelectorAll('.tq-lista.alvo').forEach((l) => l.classList.remove('alvo'));
  const sob = document.elementFromPoint(e.clientX, e.clientY);
  const col = sob && sob.closest('.tq-col');
  const lista = col && col.querySelector('.tq-lista');
  if (lista) {
    lista.classList.add('alvo');
    const cards = [...lista.querySelectorAll('.tq-card:not(.fantasma)')];
    let i = cards.findIndex((c) => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
    if (i < 0) i = cards.length;
    const vazio = lista.querySelector('.tq-vazio'); if (vazio) vazio.remove();
    if (cards[i]) lista.insertBefore(a.card, cards[i]); else lista.appendChild(a.card);
  }
  if (e.clientY < 60) scrollBy(0, -12); else if (e.clientY > innerHeight - 60) scrollBy(0, 12);
}, { passive: false });
function tqSoltar() {
  const a = tqArraste; tqArraste = null;
  if (!a) return;
  document.body.classList.remove('arrastando');
  if (!a.ativo) return;
  a.voando.remove();
  document.querySelectorAll('.tq-lista.alvo').forEach((l) => l.classList.remove('alvo'));
  const lista = a.card.closest('.tq-lista');
  const ids = [...lista.querySelectorAll('.tq-card')].map((c) => c.dataset.tqId);
  const coluna = lista.dataset.col;
  const vizinho = ids[ids.indexOf(a.id) + 1];
  const todas = tqDaColuna(coluna).filter((x) => x.id !== a.id);
  const indice = vizinho ? todas.findIndex((x) => x.id === vizinho) : todas.length;
  a.card.classList.remove('fantasma');
  tqUltimoArraste = Date.now();
  tqMover(a.id, coluna, indice < 0 ? todas.length : indice);
}
document.addEventListener('pointerup', tqSoltar);
document.addEventListener('pointercancel', () => { if (tqArraste && tqArraste.ativo) tqSoltar(); else tqArraste = null; });
document.addEventListener('touchmove', (e) => { if (tqArraste && tqArraste.ativo) e.preventDefault(); }, { passive: false });

/* cliques, teclado e formulário de nova tarefa (dentro da visão) */
$('#visao').addEventListener('click', (e) => {
  const card = e.target.closest('.tq-card');
  if (card) { if (Date.now() - tqUltimoArraste > 250) tqAbrir(card.dataset.tqId); return; }
  const p = e.target.closest('[data-tq-pessoa]');
  if (p) { tq.pessoa = p.dataset.tqPessoa; try { localStorage.setItem('dzti-tarefas-pessoa', tq.pessoa); } catch (_) {} tqRender(); return; }
  const n = e.target.closest('[data-tq-nova]');
  if (n) { tq.abertaNova = n.dataset.tqNova; tqRender(); return; }
  if (e.target.closest('[data-tq-fechar-nova]')) { tq.abertaNova = null; tqRender(); return; }
  if (e.target.closest('[data-tq-antigos]')) { tq.verAntigos = !tq.verAntigos; tqRender(); }
});
$('#visao').addEventListener('input', (e) => { if (e.target.id === 'tq-busca') { tq.busca = e.target.value.trim(); tqRender(); } });
$('#visao').addEventListener('keydown', (e) => {
  const card = e.target.closest('.tq-card');
  if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tqAbrir(card.dataset.tqId); return; }
  const ta = e.target.closest('.tq-form-nova textarea');
  if (ta && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ta.form.requestSubmit(); }
  if (ta && e.key === 'Escape') { tq.abertaNova = null; tqRender(); }
});
$('#visao').addEventListener('submit', (e) => {
  const f = e.target.closest('.tq-form-nova');
  if (!f) return;
  e.preventDefault();
  const titulo = f.titulo.value.trim();
  if (!titulo) return;
  tqCriar(f.dataset.col, titulo);
  tqRender(); // continua aberto para a próxima tarefa
});

/* diálogo de edição */
const tqDlg = $('#tq-dlg');
const tqLinks = (txt) => [...new Set(String(txt).match(/https?:\/\/[^\s<>"')]+/g) || [])];
function tqMostrarLinks() {
  $('#tq-links').innerHTML = tqLinks($('#tq-notas').value).map((u) => '<li><a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u.length > 70 ? u.slice(0, 67) + '…' : u) + ' ↗</a></li>').join('');
}
const tqAjustarTitulo = () => { const t = $('#tq-titulo'); t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; };
function tqAbrir(id) {
  const t = tq.tarefas.find((x) => x.id === id); if (!t) return;
  tq.editando = id;
  $('#tq-titulo').value = t.titulo;
  $('#tq-coluna').innerHTML = TQ_COLUNAS.map((c) => '<option' + (c.nome === t.coluna ? ' selected' : '') + '>' + esc(c.nome) + '</option>').join('');
  const pessoas = !t.responsavel || TQ_PESSOAS.includes(t.responsavel) ? TQ_PESSOAS : TQ_PESSOAS.concat(t.responsavel);
  $('#tq-resp').innerHTML = '<option value="">—</option>' + pessoas.map((p) => '<option' + (p === t.responsavel ? ' selected' : '') + '>' + esc(p) + '</option>').join('');
  $('#tq-prazo').value = t.prazo || '';
  $('#tq-notas').value = t.notas || '';
  const ex = $('#tq-excluir'); ex.textContent = 'Excluir tarefa'; delete ex.dataset.confirmar;
  $('#tq-datas').textContent = t.concluidoEm ? 'Concluída em ' + new Date(t.concluidoEm).toLocaleDateString('pt-BR') : '';
  tqMostrarLinks();
  if (tqDlg.showModal) tqDlg.showModal(); else tqDlg.setAttribute('open', '');
  tqAjustarTitulo(); $('#tq-titulo').focus();
}
function tqFechar() { tq.editando = null; if (tqDlg.close) tqDlg.close(); else tqDlg.removeAttribute('open'); tqRender(); }
$('#tq-notas').addEventListener('input', tqMostrarLinks);
$('#tq-titulo').addEventListener('input', tqAjustarTitulo);
$('#tq-titulo').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); $('#tq-ficha').requestSubmit(); } });
$('#tq-cancelar').addEventListener('click', tqFechar);
tqDlg.addEventListener('cancel', (e) => { e.preventDefault(); tqFechar(); });
$('#tq-ficha').addEventListener('submit', (e) => {
  e.preventDefault();
  const t = tq.tarefas.find((x) => x.id === tq.editando);
  if (!t) return tqFechar();
  const titulo = $('#tq-titulo').value.trim();
  if (!titulo) { $('#tq-titulo').focus(); return; }
  const coluna = $('#tq-coluna').value;
  Object.assign(t, { titulo, responsavel: $('#tq-resp').value, prazo: $('#tq-prazo').value, notas: $('#tq-notas').value });
  tqEnfileirar({ tipo: 'salvar', tarefa: Object.assign({}, t) });
  if (coluna !== t.coluna) tqMover(t.id, coluna, 0);
  tqFechar();
});
$('#tq-excluir').addEventListener('click', (e) => {
  const b = e.currentTarget;
  if (!b.dataset.confirmar) { b.dataset.confirmar = '1'; b.textContent = 'Clique de novo para excluir'; return; }
  const id = tq.editando;
  tq.tarefas = tq.tarefas.filter((x) => x.id !== id);
  tqEnfileirar({ tipo: 'excluir', id });
  tqFechar(); toast('Tarefa excluída');
});
// quando outra pessoa mexe: atualiza a cada minuto e ao voltar para a aba (só com a visão aberta)
setInterval(() => { if (!document.hidden && !DEMO && estado.visao === 'tarefas') tqAtualizar(true); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !DEMO && estado.visao === 'tarefas' && tq.sync && Date.now() - tq.sync > 20000) tqAtualizar(true); });
window.addEventListener('beforeunload', (e) => { if (tq.fila.length || tq.enviando) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- início ---------- */
$('#aviso-demo').hidden = !DEMO;
{ const h = location.hash.slice(1); if (VISOES.some((x) => x.id === h)) estado.visao = h; }
const guardada = lerSenha();
if (guardada) entrar(guardada, true); else $('#login').hidden = false;
</script>
